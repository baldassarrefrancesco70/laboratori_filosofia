<style>

*{box-sizing:border-box}
body{margin:0;padding:16px 16px 80px;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}

summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 14px;font-weight:600;color:var(--acc)}

button{font:inherit;min-height:44px;border-radius:10px;cursor:pointer}
.btn{padding:10px 18px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);font-weight:600}

.opt:hover:not(:disabled){border-color:var(--acc)}

.fb.ok{background:var(--ok-bg)}.fb.ko{background:var(--ko-bg)}.fb.neutral{background:var(--quote)}
.fb b{display:block;margin-bottom:2px}
textarea{width:100%;min-height:160px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}

.notice{border:1px dashed var(--muted);border-radius:10px;padding:8px 12px;font-size:.9rem;color:var(--muted);margin:0 0 12px}
.box{border:1px solid var(--acc);border-radius:12px;padding:12px 14px;background:var(--quote)}
ul.check{padding-left:1.2em}ul.check li{margin:0 0 6px}

.tag{font-weight:600}.tag.ok{color:var(--ok)}.tag.ko{color:var(--ko)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

<script>
(function(){
"use strict";
var L = {"labId": "filosofia_hegel_gemma", "title": "Il fiore confuta la gemma", "eyebrow": "Filosofia · Hegel · Palestra", "tempoAtteso": 540, "caratteriAttesi": 220, "richiamo": {"title": "Da dove viene il passo", "paras": ["Il passo viene dalla Prefazione alla Fenomenologia dello spirito (1807). In quel punto Hegel spiega perché una prefazione non dovrebbe mettersi a dire in che cosa il libro è d'accordo o in disaccordo con le altre filosofie.", "Chi ragiona così, dice, vede nella storia della filosofia soltanto sistemi che si contraddicono: uno ha ragione, gli altri torto. Per mostrare che cosa gli sfugge, Hegel usa un'immagine presa dalla vita di una pianta."]}, "testo": {"titolo": "G.W.F. Hegel, Fenomenologia dello spirito, Prefazione", "fonte": "Dal secondo paragrafo della Prefazione.", "paras": ["Quanto più l'opinione tiene per fissa l'opposizione tra vero e falso, tanto più si aspetta, di fronte a un sistema filosofico esistente, o l'adesione o la contraddizione, e in una presa di posizione su di esso sa vedere soltanto l'una o l'altra. Essa non concepisce la diversità dei sistemi filosofici come lo sviluppo progressivo della verità, ma nella diversità vede soltanto la contraddizione.", "La gemma scompare nello sbocciare del fiore, e si potrebbe dire che quella è confutata da questo; allo stesso modo il frutto dichiara il fiore una falsa esistenza della pianta, e ne prende il posto come sua verità. Queste forme non soltanto si distinguono, ma si soppiantano anche l'una con l'altra, in quanto incompatibili tra loro. Ma la loro natura fluida ne fa al tempo stesso momenti dell'unità organica, nella quale non solo non si contrastano, ma l'una è necessaria quanto l'altra; e questa uguale necessità è ciò che soltanto costituisce la vita dell'intero."], "nota": "Traduzione di lavoro dal tedesco, non condotta su un'edizione italiana. «Gemma» traduce Knospe (più propriamente: bocciolo).", "glossario": [["confutare", "dimostrare che una tesi è falsa"], ["momento", "in Hegel: una fase o un lato che vale solo all'interno di un intero, non una frazione di tempo"], ["organico", "che ha la struttura di un essere vivente, dove ogni parte esiste in relazione alle altre"]]}, "sections": [{"kind": "info", "id": "richiamo", "title": "Da dove viene il passo", "fromRichiamo": true}, {"kind": "text", "id": "testo", "title": "Il testo", "fase": "Introduzione e lettura · 3 minuti", "intro": "Leggi il passo con calma: ti servirà per tutte le domande. Potrai riaprirlo in ogni momento."}, {"kind": "classify", "id": "g1", "fase": "Fase 1 · individuale · 7 minuti · a", "title": "Due gruppi di parole", "consegna": "Per ogni espressione del passo, decidi che cosa dice del rapporto tra le forme della pianta.", "categories": ["Una forma elimina l'altra", "Una forma conserva l'altra, ne ha bisogno"], "items": [{"id": "g1_1", "text": "«la gemma scompare»", "correct": 0, "spieg": "La gemma non c'è più quando c'è il fiore."}, {"id": "g1_2", "text": "«quella è confutata da questo»", "correct": 0, "spieg": "Confutare è il gesto con cui una tesi mostra falsa un'altra: il linguaggio della contraddizione tra filosofie."}, {"id": "g1_3", "text": "«l'una è necessaria quanto l'altra»", "correct": 1, "spieg": "Nessuna forma vale meno delle altre: tutte sono richieste."}, {"id": "g1_4", "text": "«il frutto dichiara il fiore una falsa esistenza della pianta»", "correct": 0, "spieg": "Il frutto non si limita a seguire il fiore: lo dichiara falso."}, {"id": "g1_5", "text": "«ne prende il posto»", "correct": 0, "spieg": "Sostituzione: dove c'è l'uno non c'è l'altro."}, {"id": "g1_6", "text": "«momenti dell'unità organica»", "correct": 1, "spieg": "Un momento vale dentro l'intero: la forma eliminata resta come parte della vita della pianta."}, {"id": "g1_7", "text": "«si soppiantano anche l'una con l'altra, in quanto incompatibili»", "correct": 0, "spieg": "Hegel insiste sul contrasto: le forme sono incompatibili."}]}, {"kind": "mc", "id": "g2", "fase": "Fase 1 · b", "title": "Il punto di svolta", "prompt": "Da quale frase in poi il passo smette di elencare ciò che viene eliminato?", "options": ["«Queste forme non soltanto si distinguono, ma si soppiantano anche l'una con l'altra…»", "«Ma la loro natura fluida ne fa al tempo stesso momenti…»", "«allo stesso modo il frutto dichiara il fiore una falsa esistenza della pianta…»", "«Essa non concepisce la diversità dei sistemi filosofici come lo sviluppo progressivo…»"], "correct": 1, "spieg": "«Ma» è il cardine: fin lì il passo parla solo di negazione, da lì in poi le stesse forme sono tenute insieme. Guarda anche «al tempo stesso»: il secondo lato non cancella il primo. Il «ma» di «non soltanto si distinguono, ma si soppiantano» è un falso cardine: rafforza la negazione invece di superarla."}, {"kind": "classify", "id": "g3", "fase": "Fase 1 · c", "title": "Che cosa succede alla gemma", "consegna": "Decidi se ogni affermazione è vera o falsa secondo il passo.", "categories": ["Vero secondo il passo", "Falso secondo il passo"], "items": [{"id": "g3_1", "text": "La gemma scompare davvero: il fiore non è semplicemente una gemma diventata più grande.", "correct": 0, "spieg": "La negazione è reale: la gemma «scompare»."}, {"id": "g3_2", "text": "La gemma era soltanto un mezzo per arrivare al frutto, l'unica forma che conta davvero.", "correct": 1, "spieg": "Il passo dice il contrario: l'una è necessaria «quanto» l'altra, e la vita è quella dell'intero, non dell'ultima fase."}, {"id": "g3_3", "text": "Il fiore si aggiunge alla gemma, che resta com'era accanto a lui.", "correct": 1, "spieg": "Le forme si «soppiantano»: la gemma non resta com'era. Resta, ma come momento."}, {"id": "g3_4", "text": "Senza la gemma non ci sarebbe la vita intera della pianta.", "correct": 0, "spieg": "È la «uguale necessità» che costituisce la vita dell'intero."}, {"id": "g3_5", "text": "Parlare di «confutazione» è solo un modo di dire: tra gemma e fiore, in realtà, non c'è nessun contrasto.", "correct": 1, "spieg": "Il contrasto è reale: le forme sono «incompatibili». Hegel non lo nega; dice che non è tutta la verità."}]}, {"kind": "info", "id": "aufheben", "title": "Il nome di quello che hai trovato", "fase": "Richiamo · 1 minuto", "paras": ["Nel passo hai trovato due cose insieme: una forma viene davvero eliminata, e insieme resta, come momento necessario dell'intero. Hegel chiama questo movimento con un verbo tedesco d'uso comune: aufheben (sostantivo: Aufhebung). Nel passo della gemma la parola non compare: l'immagine mostra la cosa, un'altra opera le dà il nome. Nella Scienza della logica Hegel spiega perché ha scelto proprio questa parola:"], "quote": "«Aufheben ha nella lingua un doppio senso: significa tanto conservare, mantenere, quanto far cessare, porre fine. [...] Così ciò che è aufgehoben è insieme qualcosa di conservato, che ha perduto soltanto la sua immediatezza, ma non per questo è annientato.»", "orange": "Traduzione di lavoro dal tedesco (Scienza della logica, libro I)."}, {"kind": "essay", "id": "g4", "fase": "Esempio · individuale · 4 minuti", "title": "Un esempio tuo", "prompt": "Trova un processo che non venga dalla filosofia (nello sport, nella musica, nello studio, nella natura, nella vita di una persona) in cui una fase successiva elimina la precedente e insieme ne ha bisogno. Descrivilo in 3–4 righe: che cosa viene eliminato? Che cosa resta?", "min": 60, "max": 1500, "righe": 6, "checklist": null, "noSolution": "Qui non c'è una soluzione: alcuni esempi saranno discussi in classe."}, {"kind": "selfcheck", "id": "g5", "fase": "Esempio · le due prove", "title": "Metti alla prova il tuo esempio", "intro": "Non ci sono risposte giuste: rispondi pensando al tuo esempio.", "items": [{"id": "g5_1", "text": "Nel tuo esempio, la fase successiva elimina davvero la precedente (la rende impossibile, falsa, superata)?"}, {"id": "g5_2", "text": "E ne ha bisogno: senza la fase precedente, quella successiva non ci sarebbe?"}], "options": ["Sì", "Non del tutto"], "after": "Se hai risposto «non del tutto» almeno una volta, il tuo esempio è un buon caso da portare in discussione: per Hegel servono entrambe le cose."}]};
var KEY = "addestr_state_" + L.labId;
var TIP = "Analizzare testi";
var SECS = L.sections;
var S = load() || { i:0, a:{}, done:false };
var app = document.getElementById("app");
var registered = true;

function load(){ try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function hash(s){ var h = 2166136261; for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function order(n, seed){ var a=[],i; for(i=0;i<n;i++)a.push(i); var x=hash(seed)||1; for(i=n-1;i>0;i--){ x^=x<<13; x^=x>>>17; x^=x<<5; x>>>=0; var j=x%(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function isChoice(s){ return s.kind==="mc" || s.kind==="classify"; }
var LAST_CHOICE = -1; SECS.forEach(function(s,k){ if (isChoice(s)) LAST_CHOICE = k; });

function header(){
  var h = el("header");
  h.appendChild(el("p","eyebrow",L.eyebrow));
  h.appendChild(el("h1",null,L.title));
  var c = el("span","chip",TIP); h.appendChild(c);
  var p = el("div","progress"); var bar = el("div"); p.appendChild(bar);
  bar.style.width = (S.done ? 100 : Math.round(100*S.i/SECS.length)) + "%";
  p.setAttribute("role","progressbar"); p.setAttribute("aria-label","Avanzamento");
  p.setAttribute("aria-valuemin","0"); p.setAttribute("aria-valuemax","100"); p.setAttribute("aria-valuenow", S.done?100:Math.round(100*S.i/SECS.length));
  h.appendChild(p);
  return h;
}
function textBlock(){
  var d = el("div");
  var q = el("div","hegel");
  L.testo.paras.forEach(function(t){ q.appendChild(el("p",null,t)); });
  d.appendChild(el("p","fase",L.testo.titolo));
  d.appendChild(q);
  d.appendChild(el("p","warn",L.testo.nota));
  var dl = el("dl","gloss");
  L.testo.glossario.forEach(function(g){ dl.appendChild(el("dt",null,g[0])); dl.appendChild(el("dd",null,g[1])); });
  var gd = el("details"); var gs = el("summary",null,"Parole da tenere presenti"); gd.appendChild(gs);
  var gi = el("div","inner"); gi.appendChild(dl); gd.appendChild(gi); d.appendChild(gd);
  return d;
}
function rereadBox(){
  var d = el("details"); d.appendChild(el("summary",null,"Rileggi il testo"));
  var i = el("div","inner"); i.appendChild(textBlock()); d.appendChild(i); return d;
}
function catText(s, k){ return s.kind==="mc" ? s.options[k] : s.categories[k]; }

function renderChoiceItem(card, s, it, prompt, labels, correctIdx, spieg, ordered){
  var box = el("div","item");
  box.appendChild(el("p","q",prompt));
  var chosen = S.a[it];
  var ids = ordered || labels.map(function(_,k){return k;});
  ids.forEach(function(k){
    var b = el("button","opt",labels[k]); b.type="button";
    b.setAttribute("aria-pressed", chosen===k ? "true":"false");
    if (chosen !== undefined){ b.disabled = true; if (k===correctIdx) b.classList.add("right"); else if (k===chosen) b.classList.add("wrong"); }
    b.onclick = function(){ if (S.a[it]!==undefined) return; S.a[it]=k; persist(); render(it); };
    box.appendChild(b);
  });
  if (chosen !== undefined){
    var ok = chosen===correctIdx;
    var fb = el("div","fb "+(ok?"ok":"ko")); fb.setAttribute("role","status");
    fb.appendChild(el("b",null, ok ? "Giusto." : "Non proprio: la risposta è «"+labels[correctIdx]+"»."));
    fb.appendChild(document.createTextNode(spieg));
    box.appendChild(fb);
  }
  box.id = "it_"+it;
  card.appendChild(box);
}

function sectionComplete(s){
  if (s.kind==="mc") return S.a[s.id]!==undefined;
  if (s.kind==="classify") return s.items.every(function(it){ return S.a[it.id]!==undefined; });
  if (s.kind==="essay") return (S.a[s.id]||"").trim().length >= s.min;
  if (s.kind==="selfcheck") return s.items.every(function(it){ return S.a[it.id]!==undefined; });
  return true;
}

function render(focusId){
  app.innerHTML = "";
  app.appendChild(header());
  if (!registered) app.appendChild(el("div","notice","Registro non raggiungibile: puoi svolgere comunque l'esercitazione."));
  if (S.done) return renderDone();
  var s = SECS[S.i];
  var nx = null, upd = null;
  var card = el("section","card");
  if (s.fase) card.appendChild(el("p","fase",s.fase));
  card.appendChild(el("h2",null,s.title));

  if (s.kind==="info" && s.fromRichiamo){
    L.richiamo.paras.forEach(function(t){ card.appendChild(el("p",null,t)); });
  } else if (s.kind==="info"){
    var bx = el("div","box");
    s.paras.forEach(function(t){ bx.appendChild(el("p",null,t)); });
    var q = el("div","hegel"); q.appendChild(el("p",null,s.quote)); bx.appendChild(q);
    bx.appendChild(el("p","warn",s.orange));
    card.appendChild(bx);
  } else if (s.kind==="text"){
    card.appendChild(el("p",null,s.intro));
    card.appendChild(textBlock());
  } else {
    card.appendChild(rereadBox());
    if (s.kind==="mc"){
      renderChoiceItem(card, s, s.id, s.prompt, s.options, s.correct, s.spieg, null /* ordine fisso, già mescolato nella sorgente: coincide con la scheda */);
    } else if (s.kind==="classify"){
      card.appendChild(el("p",null,s.consegna));
      s.items.forEach(function(it,n){ renderChoiceItem(card, s, it.id, (n+1)+". "+it.text, s.categories, it.correct, it.spieg); });
    } else if (s.kind==="essay"){
      var lab = el("label",null,s.prompt); lab.setAttribute("for","ta_"+s.id); lab.style.fontWeight="600"; lab.style.display="block"; lab.style.marginBottom="8px";
      card.appendChild(lab);
      var t = el("textarea"); t.id="ta_"+s.id; t.maxLength=s.max; t.value=S.a[s.id]||"";
      var c = el("div","count");
      upd = function(){ c.textContent = t.value.length+" / "+s.max+" caratteri" + (t.value.trim().length < s.min ? " · scrivi almeno "+s.min+" caratteri per proseguire" : ""); if (nx) nx.disabled = !sectionComplete(s); };
      t.oninput = function(){ S.a[s.id]=t.value; persist(); upd(); };
      card.appendChild(t); card.appendChild(c);
      if (s.noSolution) card.appendChild(el("p","warn",s.noSolution));
    } else if (s.kind==="selfcheck"){
      card.appendChild(el("p",null,s.intro));
      s.items.forEach(function(it){
        var box = el("div","item"); box.appendChild(el("p","q",it.text));
        s.options.forEach(function(o,k){
          var b = el("button","opt",o); b.type="button"; b.setAttribute("aria-pressed", S.a[it.id]===k?"true":"false");
          b.onclick=function(){ S.a[it.id]=k; persist(); render(it.id); };
          box.appendChild(b);
        });
        card.appendChild(box);
      });
      if (sectionComplete(s)){ var f = el("div","fb neutral"); f.textContent = s.after; card.appendChild(f); }
    }
  }

  // navigazione
  var nav = el("div","nav");
  var canBack = S.i>0 && S.i !== LAST_CHOICE+1;
  if (canBack){ var bk = el("button","btn sec","Indietro"); bk.type="button"; bk.onclick=function(){ S.i--; persist(); render(); window.scrollTo(0,0); }; nav.appendChild(bk); }
  nav.appendChild(el("span","sp"));
  var last = S.i===SECS.length-1;
  nx = el("button","btn", last ? "Consegna" : "Avanti"); nx.type="button";
  nx.disabled = !sectionComplete(s);
  nx.onclick = function(){ if (!sectionComplete(s)) return; if (last) return consegna(); S.i++; persist(); render(); window.scrollTo(0,0); };
  nav.appendChild(nx);
  if (upd) upd();
  if (S.i===LAST_CHOICE+1 && LAST_CHOICE>=0) card.appendChild(el("div","notice","Le risposte a scelta sono chiuse: da qui non si torna indietro, così le risposte già date restano quelle che hai scelto prima di vedere le soluzioni."));
  if (S.i===LAST_CHOICE && sectionComplete(s)) card.appendChild(el("div","notice","Attenzione: dopo «Avanti» non potrai più tornare a questa parte."));
  card.appendChild(nav);
  app.appendChild(card);
  if (focusId){ var f2 = document.getElementById("it_"+focusId); if (f2){ var b2 = f2.querySelector(".fb") || f2; b2.scrollIntoView({block:"nearest"}); } }
}

function answers(){
  var out = [];
  SECS.forEach(function(s){
    if (s.kind==="mc" && S.a[s.id]!==undefined) out.push({id:s.id, prompt:s.prompt.slice(0,300), type:"mc", answer:s.options[S.a[s.id]], correct:S.a[s.id]===s.correct});
    if (s.kind==="classify") s.items.forEach(function(it){ if (S.a[it.id]!==undefined) out.push({id:it.id, prompt:it.text.slice(0,300), type:"mc", answer:s.categories[S.a[it.id]], correct:S.a[it.id]===it.correct}); });
    if (s.kind==="essay" && (S.a[s.id]||"").trim()) out.push({id:s.id, prompt:s.prompt.slice(0,300), type:"essay", answer:String(S.a[s.id]).slice(0,4000), correct:null});
    if (s.kind==="selfcheck") s.items.forEach(function(it){ if (S.a[it.id]!==undefined) out.push({id:it.id, prompt:it.text.slice(0,300), type:"essay", answer:s.options[S.a[it.id]], correct:null}); });
  });
  return out;
}
function score(){ var a = answers().filter(function(x){return x.type==="mc";}); if (!a.length) return null; return Math.round(100*a.filter(function(x){return x.correct;}).length/a.length); }

function consegna(){
  S.done = true; S.score = score(); persist();
  try { if (window.Addestramento && Addestramento.completa) Addestramento.completa(answers(), S.score); } catch(e){ registered = false; }
  render(); window.scrollTo(0,0);
}

function renderDone(){
  var card = el("section","card");
  card.appendChild(el("h2",null,"Consegnato: ecco la correzione"));
  var mcs = answers().filter(function(x){return x.type==="mc";});
  var ok = mcs.filter(function(x){return x.correct;}).length;
  card.appendChild(el("p","score","Risposte a scelta corrette: "+ok+" su "+mcs.length));
  SECS.forEach(function(s){
    if (s.kind==="mc" || s.kind==="classify"){
      var list = s.kind==="mc" ? [{id:s.id,text:s.prompt,correct:s.correct,spieg:s.spieg}] : s.items;
      var h = el("p","fase",(s.fase||"")+" · "+s.title); h.style.marginTop="14px"; card.appendChild(h);
      list.forEach(function(it){
        var r = el("div","rev"); var mine = S.a[it.id]; var good = mine===it.correct;
        r.appendChild(el("p","q",it.text));
        var p = el("p"); var tg = el("span","tag "+(good?"ok":"ko"), good?"✓ Giusto. ":"✗ Non proprio. "); p.appendChild(tg);
        p.appendChild(document.createTextNode("Tua risposta: «"+catText(s,mine)+"»"+(good?"":" · Risposta attesa: «"+catText(s,it.correct)+"»")));
        r.appendChild(p); r.appendChild(el("p",null,it.spieg)); card.appendChild(r);
      });
    } else if (s.kind==="essay"){
      var h2 = el("p","fase",(s.fase||"")+" · "+s.title); h2.style.marginTop="14px"; card.appendChild(h2);
      var r2 = el("div","rev"); r2.appendChild(el("p","q",s.prompt)); r2.appendChild(el("div","mine",S.a[s.id]||""));
      if (s.checklist){ r2.appendChild(el("p","tag",s.checklistTitle+":")); var ul = el("ul","check"); s.checklist.forEach(function(c){ ul.appendChild(el("li",null,c)); }); r2.appendChild(ul); }
      if (s.noSolution) r2.appendChild(el("p","warn",s.noSolution));
      card.appendChild(r2);
    } else if (s.kind==="selfcheck"){
      var h3 = el("p","fase",(s.fase||"")+" · "+s.title); h3.style.marginTop="14px"; card.appendChild(h3);
      s.items.forEach(function(it){ var r3 = el("div","rev"); r3.appendChild(el("p","q",it.text)); r3.appendChild(el("p",null,"Tua risposta: «"+s.options[S.a[it.id]]+"»")); card.appendChild(r3); });
      card.appendChild(el("div","fb neutral",s.after));
    }
  });
  var nav = el("div","nav"); nav.appendChild(el("span","sp"));
  var again = el("button","btn sec","Ricomincia da capo"); again.type="button";
  again.onclick = function(){ S = {i:0,a:{},done:false}; persist(); render(); window.scrollTo(0,0); };
  nav.appendChild(again); card.appendChild(nav);
  app.appendChild(card);
}

function start(){
  if (window.Addestramento && typeof Addestramento.start === "function"){
    try {
      Addestramento.start({ labId:L.labId, title:L.title, tempoAtteso:L.tempoAtteso, caratteriAttesi:L.caratteriAttesi, onReady:function(){ render(); } });
      return;
    } catch(e){}
  }
  registered = false; render();
}
start();
})();
</script>
