e?"]},"q1":{"testa":"Una buona risposta contiene almeno due di questi punti:","punti":["restano le qualità primarie: figura, estensione, solidità, movimento o quiete, numero","ciò che abbiamo tolto, nel corpo, era solo un potere di produrre sensazioni","resta qualcosa di esteso: fin qui il risultato somiglia a quello di Cartesio con la cera, anche se Locke conserva la solidità"]},"q2":{"testa":"Una buona risposta contiene almeno due di questi punti:","punti":["non resta niente che si possa percepire o descrivere","il nome «mela» riunisce idee che si presentano sempre insieme","continuiamo a parlare di una cosa perché non riusciamo a immaginare qualità che stiano da sole","va bene anche sostenere che non resta nulla, se spieghi perché diciamo ancora «questa mela»"]},"finale":{"testa":"Una buona risposta contiene almeno tre di questi punti:","punti":["tolte le qualità percepite, di ciò che resta non abbiamo idea","l'idea di mela è un insieme di idee semplici, riunite da un solo nome","supponiamo un sostegno, il substratum, perché non immaginiamo qualità senza qualcosa che le sostenga","questo sostegno è supposto, non percepito: la frase citata lo mostra","va bene anche discutere se la parola «substratum» aggiunga davvero qualcosa, come nell'aneddoto dell'indiano"]},"diff":{"testa":"Una buona risposta contiene almeno due di questi punti:","punti":["«sconosciuta» riguarda ciò che sappiamo, «non esiste» riguarda ciò che c'è","Locke sostiene la prima tesi: dice di non sapere che cosa sia, non che manchi","dall'assenza di un'idea chiara non segue che la cosa non esista","va bene anche obiettare che, senza nessuna idea, è difficile sapere di che cosa stiamo parlando: è un'obiezione seria, se argomentata"]}}};
