  var D = {"labId": "filosofia_marx_dialettica_sui_piedi", "titolo": "Rimetti la dialettica sui piedi", "sottotitolo": "Marx, il materialismo storico e la prima rivoluzione industriale", "fonte": "K. Marx, Per la critica dell'economia politica, Prefazione (1859). Traduzione di lavoro dal tedesco.", "richiamo": ["Per Marx la storia non è mossa dalle idee ma dal modo in cui gli uomini producono ciò che serve a vivere.", "Forze produttive: tutto ciò che serve a produrre (lavoro umano, terra, strumenti, macchine, conoscenze tecniche).", "Rapporti di produzione: i rapporti tra gli uomini nella produzione (chi possiede i mezzi, chi lavora, come si divide il prodotto).", "Struttura: l'insieme dei rapporti di produzione, la base economica della società. Sovrastruttura: diritto, Stato, morale, religione, filosofia.", "Se non ricordi questi concetti, rileggi la Sintesi 1.2, parte G («Il materialismo storico»)."], "frasi": [{"id": "f1", "n": "1", "seg": ["Nella produzione sociale della loro vita gli uomini entrano in rapporti ", {"t": "determinati", "k": "determinati"}, ", necessari, indipendenti dalla loro volontà:"], "pos": 1, "alt": [2], "why": "La frase dice che nella produzione gli uomini stanno in rapporti precisi e non scelti: sono i rapporti di produzione, che la frase 2 lega alle forze produttive. Va bene anche la struttura, perché la frase 3 dirà che l'insieme di questi rapporti forma la struttura."}, {"id": "f2", "n": "2", "seg": ["rapporti di produzione che ", {"t": "corrispondono", "k": "corrispondono2"}, " a un ", {"t": "determinato", "k": "determinato"}, " grado di sviluppo delle loro forze produttive materiali."], "pos": 1, "alt": [], "why": "È il primo anello: a un certo livello delle forze produttive corrispondono certi rapporti di produzione."}, {"id": "f3", "n": "3", "seg": ["L'insieme di questi rapporti di produzione ", {"t": "forma", "k": "forma"}, " la struttura economica della società, la base reale,"], "pos": 2, "alt": [], "why": "Qui Marx definisce la struttura: l'insieme dei rapporti di produzione, la «base reale»."}, {"id": "f4", "n": "4", "seg": ["sulla quale ", {"t": "si eleva", "k": "eleva"}, " una sovrastruttura giuridica e politica e alla quale ", {"t": "corrispondono", "k": "corrispondono4"}, " ", {"t": "determinate", "k": "determinate"}, " forme sociali della coscienza."], "pos": 3, "alt": [], "why": "Qui compare la sovrastruttura, nelle sue due parti: quella giuridica e politica e le forme della coscienza (morale, religione, filosofia)."}, {"id": "f5", "n": "5", "seg": ["Il modo di produzione della vita materiale ", {"t": "condiziona", "k": "condiziona"}, " in generale il processo sociale, politico e spirituale della vita."], "pos": 4, "alt": [], "why": "La frase non descrive un piano ma il legame tra i due piani: l'economia «condiziona» la vita politica e spirituale. È la freccia."}, {"id": "f6", "n": "6", "seg": ["Non è la coscienza degli uomini che ", {"t": "determina", "k": "determina"}, " il loro essere, ma è, al contrario, il loro essere sociale che ", {"t": "determina", "k": "determina"}, " la loro coscienza."], "pos": 4, "alt": [], "why": "Anche questa è la freccia, ma con un verbo diverso: «determina». Due frasi di seguito descrivono lo stesso legame con due verbi diversi."}, {"id": "f7", "n": "7", "seg": ["A un certo grado del loro sviluppo le forze produttive materiali della società ", {"t": "entrano", "k": "entrano"}, " in contraddizione con i rapporti di produzione esistenti, cioè con i rapporti di proprietà (che ne sono soltanto l'espressione giuridica) entro i quali si erano mosse fino ad allora."], "pos": 5, "alt": [], "why": "È la contraddizione: le forze produttive crescono, i rapporti di proprietà restano fermi."}, {"id": "f8a", "n": "8", "seg": ["Da forme di sviluppo delle forze produttive, questi rapporti ", {"t": "si rovesciano", "k": "rovesciano"}, " in loro catene."], "pos": 5, "alt": [], "why": "I rapporti che prima favorivano lo sviluppo ora lo frenano: è ancora la contraddizione, detta con un'immagine (le catene)."}, {"id": "f8b", "n": "9", "seg": ["Subentra allora un'epoca di rivoluzione sociale."], "pos": 6, "alt": [], "why": "Dalla contraddizione nasce la rivoluzione sociale."}, {"id": "f9", "n": "10", "seg": ["Con il cambiamento della base economica ", {"t": "si sconvolge", "k": "sconvolge"}, ", più o meno rapidamente, tutta l'immensa sovrastruttura."], "pos": 6, "alt": [4], "why": "La rivoluzione cambia la base e, con essa, tutta la sovrastruttura. Va bene anche la freccia, perché la frase mostra di nuovo che la sovrastruttura dipende dalla base."}], "ordineFrasi": ["f6", "f3", "f8b", "f1", "f9", "f4", "f7", "f2", "f5", "f8a"], "posizioni": [{"n": 1, "t": "Forze produttive e rapporti di produzione si corrispondono"}, {"n": 2, "t": "Struttura economica (la base)"}, {"n": 3, "t": "Sovrastruttura (diritto, politica, forme della coscienza)"}, {"n": 4, "t": "Freccia: l'economia agisce sulla sovrastruttura"}, {"n": 5, "t": "Contraddizione tra forze produttive e rapporti di produzione"}, {"n": 6, "t": "Rivoluzione sociale"}], "verbi": {"id": "v1", "prompt": "In due frasi Marx usa un verbo che ha come soggetto l'economia (il modo di produzione, l'essere sociale) e come oggetto la vita politica e spirituale, o la coscienza. Tocca i due verbi.", "giusti": ["condiziona", "determina"], "why": "I due verbi sono «condiziona» (frase 5) e «determina» (frase 6), a una riga di distanza. «Determinati», «determinato» e «determinate» sono aggettivi: vogliono dire «precisi, definiti», non indicano un'azione dell'economia. «Corrispondono» ha come soggetto i rapporti di produzione o le forme della coscienza, non l'economia. Tieni a mente la differenza tra i due verbi: ti servirà nel biglietto finale."}, "anelli": [{"k": "A", "t": "Forze produttive nuove"}, {"k": "B", "t": "Nuovi rapporti di produzione"}, {"k": "C", "t": "Contraddizione con i vecchi rapporti"}, {"k": "D", "t": "La sovrastruttura cambia"}, {"k": "E", "t": "Intruso: qui sono la politica o le idee ad agire sull'economia"}], "carte": [{"id": "c1", "titolo": "Il vapore di Watt", "testo": "Tra il 1769 e il 1784 James Watt perfeziona la macchina a vapore: con il condensatore separato consuma molto meno carbone e produce un moto rotatorio continuo, capace di far girare qualunque macchinario. L'energia non dipende più da un fiume o dal vento: la fabbrica può sorgere accanto alla miniera o in città.", "ok": "A", "why": "Macchina, carbone, energia inanimata: sono mezzi di produzione nuovi, cioè forze produttive."}, {"id": "c2", "titolo": "La stessa legge per tutti", "testo": "Cadono i privilegi di nascita: la legge è la stessa per tutti, non ci sono più tasse e tribunali diversi per nobili, clero e terzo stato. L'uguaglianza scritta nella legge convive però con una disuguaglianza di fatto tra chi possiede le fabbriche e chi ci lavora.", "ok": "D", "why": "È un cambiamento del diritto: sovrastruttura giuridica. Per Marx l'uguaglianza davanti alla legge lascia intatta la disuguaglianza dei rapporti di produzione."}, {"id": "c3", "titolo": "Troppo poco filo", "testo": "1733: la navetta volante di John Kay rende molto più veloce il telaio a mano. Un tessitore consuma ora più filo di quanto la filatura a domicilio, lenta e dispersa nelle campagne, riesca a produrre. Il contadino-operaio, che possiede il suo filatoio e lavora in casa propria, non riesce a stare al passo.", "ok": "C", "why": "Uno strumento nuovo (forza produttiva) si scontra con il vecchio modo di organizzare il lavoro, a domicilio e con strumenti propri: i vecchi rapporti diventano un freno."}, {"id": "c4", "titolo": "Una cornice di regole", "testo": "1688-89: con la Gloriosa Rivoluzione il Parlamento inglese limita il potere del re. Ne derivano la tutela della proprietà, una disciplina dei brevetti che premia chi inventa, la fine di molti vincoli corporativi. Ottant'anni prima delle grandi invenzioni, l'Inghilterra ha già una «cornice di regole» entro cui la ricchezza può muoversi.", "ok": "E", "why": "Qui una trasformazione politica e giuridica viene prima della meccanizzazione e ne crea le condizioni: la freccia sembra andare dalla sovrastruttura alla struttura. È l'intruso, ma un marxista avrebbe una risposta: vedi il modello della casella."}, {"id": "c5", "titolo": "La campana della fabbrica", "testo": "Le nuove macchine sono troppo grandi e costose per un lavoratore: appartengono a chi ha i capitali. A chi lavora resta una sola cosa da vendere, la propria forza-lavoro, in cambio di un salario. In fabbrica si entra, ci si ferma e si esce tutti insieme, al suono della campana.", "ok": "B", "why": "Chi possiede i mezzi e chi vende la forza-lavoro: sono i nuovi rapporti di produzione, capitalista e salariato. Anche l'orario imposto dalla campana è un rapporto di produzione, non una legge dello Stato."}, {"id": "c6", "titolo": "La povertà come colpa", "testo": "Per la borghesia il successo economico è la giusta ricompensa del talento, del lavoro e del risparmio. Il rovescio: se la ricchezza premia la virtù, la povertà diventa una colpa. Il povero non è più un infelice da soccorrere con la carità, ma un individuo privo di disciplina, responsabile della propria condizione.", "ok": "D", "why": "È un modo di pensare (una morale) che giustifica i nuovi rapporti: per Marx è una forma della coscienza, cioè sovrastruttura, anzi ideologia."}], "fonteCarte": "Le carte riassumono il manuale di storia del IV anno, sezione «Come nasce l'economia del mondo moderno», paragrafi 2.1-2.6.", "casella": {"id": "casella", "prompt": "Dove lo schema non funziona. Spiegate perché la carta che avete scelto come intruso non entra nello schema di Marx. Poi chiedetevi: che cosa potrebbe rispondere un marxista?", "model": "Una buona risposta contiene almeno tre di questi punti:", "chk": ["indica la carta sulla Gloriosa Rivoluzione e spiega che lì è una decisione politica (Parlamento, tutela della proprietà, brevetti) a creare le condizioni per le nuove forze produttive", "usa la cronologia: 1688-89, decenni prima delle invenzioni tessili e del vapore (1733-1784)", "conclude che in questo caso la freccia va dalla sovrastruttura alla struttura, o almeno in tutte e due le direzioni", "prova a rispondere come un marxista: la Gloriosa Rivoluzione esprimeva già gli interessi di proprietari e mercanti legati al mercato, cioè rapporti economici in trasformazione; oppure, con Engels, l'economia decide solo «in ultima istanza»"], "anche": "Va bene anche chi sceglie la carta sulla povertà come colpa e sostiene che una morale del lavoro e del risparmio spinge a investire, quindi agisce sull'economia (è, in sostanza, la tesi di Max Weber), purché lo argomenti."}, "biglietto": {"id": "biglietto", "prompt": "Biglietto d'uscita. Per Marx la struttura determina o condiziona la sovrastruttura? Rispondi in tre righe, citando una frase del brano e una carta del caso.", "model": "Va bene sia «determina» sia «condiziona», se motivato. Una buona risposta contiene almeno tre di questi punti:", "chk": ["cita la frase 5 («condiziona in generale») o la frase 6 («determina»), meglio se tutte e due", "nota che Marx usa i due verbi a una riga di distanza, quindi la risposta non è scontata", "distingue i due verbi: «determina» indica una dipendenza stretta e necessaria; «condiziona» indica che l'economia pone le condizioni ma lascia spazio ad altri fattori", "usa una carta come prova: per esempio le macchine di Watt, i nuovi rapporti e la morale della povertà come colpa (a favore di «determina»), oppure la Gloriosa Rivoluzione (a favore di «condiziona»)"]}, "fasi": [{"min": "0-6", "mod": "Individuale", "cosa": "Leggi il brano e tocca i due verbi."}, {"min": "6-14", "mod": "Coppie", "cosa": "Discuti con il compagno dove collocare le 10 frasi sullo schema; ciascuno registra la collocazione concordata sul proprio dispositivo e la conferma."}, {"min": "14-18", "mod": "Classe", "cosa": "Verifica dello schema."}, {"min": "18-27", "mod": "Gruppi di 4", "cosa": "Collocate le sei carte sugli anelli dello schema, trovate l'intruso e scrivete la casella «Dove lo schema non funziona». Ciascuno registra sul proprio dispositivo."}, {"min": "27-33", "mod": "Classe", "cosa": "Giro rapido: un fatto per anello, poi le caselle. Determina o condiziona?"}, {"min": "33-37", "mod": "Individuale", "cosa": "Biglietto d'uscita e consegna. Dopo la consegna compare la correzione."}, {"min": "37-40", "mod": "Classe", "cosa": "Lettura di alcuni biglietti."}]};

    }
    box(10, 10, 320, 66, "3", ["Sovrastruttura: diritto, politica,", "forme della coscienza"]);
    s.appendChild(sv("line", { x1: 170, y1: 196, x2: 170, y2: 82, "marker-end": "url(#ah)" }));
    s.appendChild(sv("text", { x: 180, y: 145, class: "num" }, "4"));
    s.appendChild(sv("text", { x: 196, y: 145 }, "freccia"));
    box(10, 200, 320, 44, "2", ["Struttura economica (la base)"]);
    s.appendChild(sv("line", { x1: 170, y1: 292, x2: 170, y2: 250, "marker-end": "url(#ah)" }));
    box(10, 296, 140, 62, "", ["Forze", "produttive"]);
    box(190, 296, 140, 62, "", ["Rapporti di", "produzione"]);
    s.appendChild(sv("line", { x1: 154, y1: 340, x2: 186, y2: 340, "marker-end": "url(#ah)", "marker-start": "url(#ah)" }));
    s.appendChild(sv("text", { x: 164, y: 330, class: "num" }, "1"));
    box(10, 382, 320, 62, "5", ["Contraddizione tra forze", "produttive e rapporti"], "cx");
    s.appendChild(sv("line", { x1: 170, y1: 446, x2: 170, y2: 474, "marker-end": "url(#ah)" }));
    box(10, 478, 320, 44, "6", ["Rivoluzione sociale"]);
    return s;
  }

  function render() {
    clear(); app.appendChild(header());
    if (S.sub) return renderReview();
    [renderVerbi, renderFrasi, renderPausa1, renderCarte, renderPausa2, renderBiglietto][S.s]();
    window.scrollTo(0, 0);
  }
  // Vista classe: istantanea anonima della fase, per la proiezione in classe.
  // Non è una consegna e non blocca nulla: se la funzione non esiste (adattatore
  // vecchio) o l'invio fallisce, l'esercitazione prosegue normalmente.
  var FASE_LIVE = { 0: "fase1", 1: "fase2", 3: "fase3" };
  function idsFase(fase) {
    if (fase === "fase1") return [D.verbi.id];
    if (fase === "fase2") return D.ordineFrasi.slice();
    if (fase === "fase3") return D.carte.map(function (k) { return k.id; }).concat([D.casella.id]);
    return [D.biglietto.id];
  }
  function condividiFase(fase) {
    try {
      if (!window.Addestramento || typeof window.Addestramento.condividi !== "function") return;
      var ids = idsFase(fase);
      var list = buildAnswers().list.filter(function (a) { return ids.indexOf(a.id) >= 0; });
      if (fase === "fase1") list.forEach(function (a) { a.answer = a.answer.split(" + ").sort().join(" + "); });
      Promise.resolve(window.Addestramento.condividi(fase, list)).catch(function () {});
    } catch (e) {}
  }
  function avanti() { if (FASE_LIVE[S.s]) condividiFase(FASE_LIVE[S.s]); S.s++; persist(); render(); }

  function renderVerbi() {
    var c = el("div", "card"); progress(c);
    c.appendChild(el("div", "fase", "Fase 1 · individuale · 6 minuti"));
    var r = el("details"); r.appendChild(el("summary", null, "Prima di cominciare: i concetti in breve"));
    var ul = el("ul", "r"); D.richiamo.forEach(function (t) { ul.appendChild(el("li", null, t)); }); r.appendChild(ul); c.appendChild(r);
    c.appendChild(el("h2", null, "Leggi il brano"));
    c.appendChild(el("p", "note", D.verbi.prompt + " Le parole che puoi toccare sono incorniciate."));
    c.appendChild(brano(true));
    c.appendChild(el("p", "src", D.fonte));
    c.appendChild(el("p", "sub", "Parole scelte: " + S.verbi.length + " di 2"));
    c.appendChild(el("div", "warn", "Quando confermi, la scelta non si può più cambiare."));
    var row = el("div", "row"); var b = el("button", "btn", "Conferma e vai alla fase 2"); b.type = "button";
    b.disabled = S.verbi.length !== 2; b.onclick = avanti; row.appendChild(b); c.appendChild(row);
    app.appendChild(c);
  }

  function renderFrasi() {
    var c = el("div", "card"); progress(c);
    c.appendChild(el("div", "fase", "Fase 2 · a coppie · 8 minuti"));
    c.appendChild(el("h2", null, "Rimetti le frasi sullo schema"));
    c.appendChild(el("p", null, "Ecco lo schema di Marx, con sei posizioni numerate. Le frasi del brano sono mescolate: discuti con il compagno dove va ciascuna, poi scegli la posizione dal menu. Ciascuno registra la scelta concordata sul proprio dispositivo. Due frasi possono andare nella stessa posizione."));
    c.appendChild(schema());
    var dl = el("ul", "r"); D.posizioni.forEach(function (p) { dl.appendChild(el("li", null, p.n + ". " + p.t)); }); c.appendChild(dl);
    var tot = 0;
    D.ordineFrasi.forEach(function (id, i) {
      var f = FRASI[id]; var it = el("div", "item");
      var q = el("p", "q"); q.appendChild(el("b", null, "Frase " + String.fromCharCode(65 + i) + ". ")); q.appendChild(document.createTextNode("«" + testo(f) + "»")); it.appendChild(q);
      var sel = el("select"); sel.setAttribute("aria-label", "Posizione per la frase " + String.fromCharCode(65 + i));
      sel.appendChild(el("option", null, "Scegli la posizione…")).value = "";
      D.posizioni.forEach(function (p) { var o = el("option", null, p.n + ". " + p.t); o.value = String(p.n); sel.appendChild(o); });
      if (S.frasi[id]) { sel.value = String(S.frasi[id]); sel.className = "done"; tot++; }
      sel.onchange = function () { if (sel.value) S.frasi[id] = Number(sel.value); else delete S.frasi[id]; persist(); render(); };
      it.appendChild(sel); c.appendChild(it);
    });
    c.appendChild(el("p", "sub", "Frasi collocate: " + tot + " di " + D.ordineFrasi.length));
    c.appendChild(el("div", "warn", "Quando confermi, la collocazione si blocca: poi la verifica si fa in classe, tutti insieme."));
    var row = el("div", "row"); var b = el("button", "btn", "Conferma la collocazione"); b.type = "button";
    b.disabled = tot !== D.ordineFrasi.length; b.onclick = avanti; row.appendChild(b); c.appendChild(row);
    app.appendChild(c);
  }

  function pausa(testoBig, testoSub, bottone) {
    var c = el("div", "card pause"); progress(c);
    c.appendChild(el("p", "big", testoBig)); c.appendChild(el("p", null, testoSub));
    var row = el("div", "row"); row.style.justifyContent = "center";
    var b = el("button", "btn", bottone); b.type = "button"; b.onclick = avanti; row.appendChild(b); c.appendChild(row);
    app.appendChild(c);
  }
  function renderPausa1() { pausa("Fermati qui: ora si verifica lo schema in classe.", "Ascolta, intervieni, prendi nota di ciò che non tornava. Vai avanti solo quando il docente lo dice.", "Vai alla fase 3"); }
  function renderPausa2() { pausa("Fermati qui: giro rapido in classe.", "Ogni gruppo dice un fatto per anello e legge la sua casella. Determina o condiziona? Vai avanti solo quando il docente lo dice.", "Vai al biglietto d'uscita"); }

  function renderCarte() {
    var c = el("div", "card"); progress(c);
    c.appendChild(el("div", "fase", "Fase 3 · gruppi di quattro · 9 minuti"));
    c.appendChild(el("h2", null, "Il caso: la prima rivoluzione industriale"));
    c.appendChild(el("p", null, "Sei carte, sei fatti che conoscete dal programma di storia dell'anno scorso. Cinque vanno sugli anelli dello schema di Marx. Una è un intruso: un fatto in cui sono la politica o le idee ad agire sull'economia, e non il contrario. Discutete in gruppo; ciascuno registra le scelte sul proprio dispositivo."));
    c.appendChild(branoChiuso());
    var tot = 0;
    D.carte.forEach(function (k, i) {
      var it = el("div", "item carta");
      it.appendChild(el("h3", null, "Carta " + (i + 1) + " · " + k.titolo));
      it.appendChild(el("p", null, k.testo));
      var sel = el("select"); sel.setAttribute("aria-label", "Anello per la carta " + (i + 1));
      sel.appendChild(el("option", null, "Scegli l'anello…")).value = "";
      D.anelli.forEach(function (a) { var o = el("option", null, a.t); o.value = a.k; sel.appendChild(o); });
      if (S.carte[k.id]) { sel.value = S.carte[k.id]; sel.className = "done"; tot++; }
      sel.onchange = function () { if (sel.value) S.carte[k.id] = sel.value; else delete S.carte[k.id]; persist(); render(); };
      it.appendChild(sel); c.appendChild(it);
    });
    c.appendChild(el("p", "src", D.fonteCarte));
    c.appendChild(el("h3", null, "La vostra casella"));
    c.appendChild(el("p", "note", D.casella.prompt));
    var ta = el("textarea"); ta.maxLength = MAX_CASELLA; ta.value = S.casella; ta.setAttribute("aria-label", "Dove lo schema non funziona");
    var cnt = el("div", "cnt"); c.appendChild(ta); c.appendChild(cnt);
    c.appendChild(el("div", "warn", "Quando confermi, carte e casella si bloccano."));
    var row = el("div", "row"); var b = el("button", "btn", "Conferma carte e casella"); b.type = "button";
    function upd() { cnt.textContent = ta.value.length + " / " + MAX_CASELLA + " (almeno " + MINC + ")"; b.disabled = !(tot === D.carte.length && ta.value.trim().length >= MINC); }
    ta.oninput = function () { S.casella = ta.value; persist(); upd(); };
    upd(); b.onclick = avanti; row.appendChild(b); c.appendChild(row);
    app.appendChild(c);
  }

  function renderBiglietto() {
    var c = el("div", "card"); progress(c);
    c.appendChild(el("div", "fase", "Fase 4 · individuale · 4 minuti"));
    c.appendChild(el("h2", null, "Biglietto d'uscita"));
    c.appendChild(el("p", "note", D.biglietto.prompt));
    c.appendChild(branoChiuso());
    var ta = el("textarea"); ta.maxLength = MAX_BIGLIETTO; ta.value = S.biglietto; ta.setAttribute("aria-label", "Biglietto d'uscita");
    var cnt = el("div", "cnt"); c.appendChild(ta); c.appendChild(cnt);
    c.appendChild(el("p", "sub", "Dopo la consegna vedrai la correzione di tutte le fasi."));
    var err = el("div", "err"); c.appendChild(err);
    var row = el("div", "row"); var b = el("button", "btn", "Consegna"); b.type = "button";
    function upd() { cnt.textContent = ta.value.length + " / " + MAX_BIGLIETTO + " (almeno " + MINC + ")"; b.disabled = ta.value.trim().length < MINC; }
    ta.oninput = function () { S.biglietto = ta.value; persist(); upd(); };
    upd(); b.onclick = function () { consegna(b, err); }; row.appendChild(b); c.appendChild(row);
    app.appendChild(c);
  }

  function verbiOk() { var v = S.verbi.slice().sort().join("|"); return v === D.verbi.giusti.slice().sort().join("|"); }
  function frasiOk(id) { var f = FRASI[id], a = S.frasi[id]; return a === f.pos || f.alt.indexOf(a) >= 0; }
  function nomeVerbo(k) { for (var i = 0; i < D.frasi.length; i++) for (var j = 0; j < D.frasi[i].seg.length; j++) { var s = D.frasi[i].seg[j]; if (typeof s !== "string" && s.k === k) return s.t + " (frase " + D.frasi[i].n + ")"; } return k; }

  function buildAnswers() {
    var list = [], right = 0, tot = 0;
    if (S.verbi.length) { tot++; var vo = verbiOk(); if (vo) right++;
      list.push({ id: D.verbi.id, prompt: "Fase 1. I due verbi con cui l'economia agisce sulla sovrastruttura", type: "mc", answer: S.verbi.map(nomeVerbo).join(" + "), correct: vo }); }
    D.ordineFrasi.forEach(function (id) {
      if (!S.frasi[id]) return; tot++; var ok = frasiOk(id); if (ok) right++;
      list.push({ id: id, prompt: ("Fase 2. Frase " + FRASI[id].n + ": «" + testo(FRASI[id])).slice(0, 290) + "»", type: "mc", answer: S.frasi[id] + ". " + POS[S.frasi[id]], correct: ok });
    });
    D.carte.forEach(function (k, i) {
      if (!S.carte[k.id]) return; tot++; var ok = S.carte[k.id] === k.ok; if (ok) right++;
      list.push({ id: k.id, prompt: "Fase 3. Carta «" + k.titolo + "»", type: "mc", answer: ANELLI[S.carte[k.id]], correct: ok });
    });
    if (S.casella.trim()) list.push({ id: D.casella.id, prompt: "Fase 3. Dove lo schema non funziona", type: "essay", answer: S.casella.trim(), correct: null });
    if (S.biglietto.trim()) list.push({ id: D.biglietto.id, prompt: "Biglietto d'uscita: determina o condiziona?", type: "essay", answer: S.biglietto.trim(), correct: null });
    return { list: list, right: right, tot: tot, score: tot ? Math.round(right / tot * 100) : null };
  }

  var sending = false, tentativi = 0;
  function consegna(btn, err) {
    if (sending) return; sending = true; btn.disabled = true; err.textContent = "Consegna in corso…";
    var r = buildAnswers();
    condividiFase("biglietto");
    var invio = window.Addestramento ? Promise.resolve(window.Addestramento.completa(r.list, r.score)).catch(function () { return false; }) : Promise.resolve(null);
    invio.then(function (ok) {
      if (ok === false && ++tentativi < 2) { sending = false; btn.disabled = false; err.textContent = "Invio non riuscito: controlla la connessione e premi di nuovo «Consegna»."; return; }
      S.sub = true; S.ok = ok; persist(); sending = false; render();
    });
  }

  function esito(ok, testoRisposta, giusta) {
    var f = document.createDocumentFragment();
    var m = el("div", "res " + (ok ? "ok" : "ko")); m.appendChild(el("span", "lbl", ok ? "Corretto — " : "Non corretto — "));
    m.appendChild(document.createTextNode("la tua risposta: " + testoRisposta)); f.appendChild(m);
    if (!ok && giusta) { var g = el("div", "res ok"); g.appendChild(el("span", "lbl", "Risposta attesa: ")); g.appendChild(document.createTextNode(giusta)); f.appendChild(g); }
    return f;
  }
  function modello(o, mia) {
    var d = el("div", "card");
    d.appendChild(el("h2", null, o.titolo));
    d.appendChild(el("div", "lbl", "Che cosa hai scritto"));
    d.appendChild(el("p", null, mia || "(nessuna risposta)"));
    d.appendChild(el("div", "lbl", o.model));
    var ul = el("ul", "r"); o.chk.forEach(function (t) { ul.appendChild(el("li", null, t)); }); d.appendChild(ul);
    if (o.anche) d.appendChild(el("p", "note", o.anche));
    d.appendChild(el("p", "sub", "Confronta: che cosa avevi già? Che cosa ti è sfuggito?"));
    return d;
  }

  function renderReview() {
    var r = buildAnswers();
    var c = el("div", "card");
    c.appendChild(el("div", "sub", "Esercitazione consegnata"));
    c.appendChild(el("div", "score", r.right + " risposte su " + r.tot + " come atteso"));
    c.appendChild(el("p", null, "Ecco la correzione. Serve a capire che cosa ti manca, non a prendere un voto: le due risposte scritte non hanno una soluzione unica."));
    var stato = S.ok === true ? "Risultato registrato." : S.ok === false ? "Attenzione: il risultato NON è stato registrato. Avvisa il docente." : "Il sistema di registrazione non era raggiungibile: il risultato NON è stato registrato. Avvisa il docente.";
    c.appendChild(el("p", S.ok === true ? "note" : "warn", stato));
    app.appendChild(c);

    var d1 = el("div", "card"); d1.appendChild(el("h2", null, "Fase 1 · I due verbi"));
    d1.appendChild(esito(verbiOk(), S.verbi.map(nomeVerbo).join(" + ") || "(nessuna)", "condiziona (frase 5) + determina (frase 6)"));
    d1.appendChild(el("p", null, D.verbi.why)); app.appendChild(d1);

    var d2 = el("div", "card"); d2.appendChild(el("h2", null, "Fase 2 · Le frasi sullo schema"));
    d2.appendChild(schema());
    D.frasi.forEach(function (f) {
      var it = el("div", "item"); it.appendChild(el("p", "q", f.n + ". «" + testo(f) + "»"));
      var a = S.frasi[f.id];
      var giusta = f.pos + ". " + POS[f.pos] + (f.alt.length ? " (accettabile anche: " + f.alt.map(function (n) { return n + ". " + POS[n]; }).join("; ") + ")" : "");
      it.appendChild(esito(frasiOk(f.id), a ? a + ". " + POS[a] : "(nessuna)", giusta));
      it.appendChild(el("p", null, f.why)); d2.appendChild(it);
    });
    app.appendChild(d2);

    var d3 = el("div", "card"); d3.appendChild(el("h2", null, "Fase 3 · Le carte"));
    D.carte.forEach(function (k, i) {
      var it = el("div", "item"); it.appendChild(el("h3", null, "Carta " + (i + 1) + " · " + k.titolo));
      var a = S.carte[k.id];
      it.appendChild(esito(a === k.ok, a ? ANELLI[a] : "(nessuna)", ANELLI[k.ok]));
      it.appendChild(el("p", null, k.why)); d3.appendChild(it);
    });
    app.appendChild(d3);

    app.appendChild(modello({ titolo: "Fase 3 · Dove lo schema non funziona", model: D.casella.model, chk: D.casella.chk, anche: D.casella.anche }, S.casella));
    app.appendChild(modello({ titolo: "Biglietto d'uscita · Determina o condiziona?", model: D.biglietto.model, chk: D.biglietto.chk }, S.biglietto));
  }

  function avvia() {
    app = document.getElementById("app");
    if (!window.Addestramento) { render(); return; }
    window.Addestramento.start({
      labId: LAB_ID,
      title: D.titolo,
      salvaRisposte: true,      // decisione del docente: le risposte finali arrivano al registro
      tempoAtteso: 900,         // circa 15 minuti di lavoro effettivo sullo schermo
      caratteriAttesi: 400,     // casella + biglietto
      onReady: function () { app = document.getElementById("app"); render(); }
    });
  }
  avvia();
})();
</script>
</body>
</html>
