<style>

*{box-sizing:border-box}
body{margin:0;padding:16px 16px 80px;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:normal;line-height:1.25}
h1{font-size:1.6rem;margin:.1em 0 .3em}
h2{font-size:1.3rem;margin:.2em 0 .6em;color:var(--acc)}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.chip{display:inline-block;font-size:.8rem;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:2px 10px;margin:0 0 8px}

.progress{height:6px;background:var(--line);border-radius:3px;margin:10px 0 16px;overflow:hidden}
.progress>div{height:100%;background:var(--pri);transition:width .2s}
blockquote,.hegel p{margin:0 0 .8em}
.hegel{background:var(--quote);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.warn{color:var(--warn);font-size:.9rem;font-style:italic}
.gloss dt{font-weight:600;margin-top:6px}.gloss dd{margin:0 0 4px 0;color:var(--muted)}
details{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;background:var(--card)}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 14px;font-weight:600;color:var(--acc)}
details .inner{padding:0 14px 12px}
button{font:inherit;min-height:44px;border-radius:10px;cursor:pointer}
.btn{padding:10px 18px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);font-weight:600}
.btn.sec{background:transparent;color:var(--pri)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:6px}
.nav .sp{flex:1}
.item{border-top:1px solid var(--line);padding:14px 0 6px}
.item:first-of-type{border-top:0;padding-top:4px}
.item .q{margin:0 0 8px;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt[aria-pressed=true]{border:2px solid var(--acc)}
.opt:disabled{cursor:default}
.opt.right{border:2px solid var(--ok);background:var(--ok-bg)}
.opt.wrong{border:2px solid var(--ko);background:var(--ko-bg)}
.fb{border-radius:10px;padding:10px 12px;margin:4px 0 8px;font-size:.95rem}
.fb.ok{background:var(--ok-bg)}.fb.ko{background:var(--ko-bg)}.fb.neutral{background:var(--quote)}
.fb b{display:block;margin-bottom:2px}
textarea{width:100%;min-height:160px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.count{font-size:.85rem;color:var(--muted);text-align:right;margin:4px 0 10px}
.notice{border:1px dashed var(--muted);border-radius:10px;padding:8px 12px;font-size:.9rem;color:var(--muted);margin:0 0 12px}
.box{border:1px solid var(--acc);border-radius:12px;padding:12px 14px;background:var(--quote)}
ul.check{padding-left:1.2em}ul.check li{margin:0 0 6px}
.score{font-size:1.2rem;font-family:Georgia,serif}
.rev{border-top:1px solid var(--line);padding:10px 0}
.rev .mine{white-space:pre-wrap;background:var(--quote);border-radius:8px;padding:8px 10px}
.tag{font-weight:600}.tag.ok{color:var(--ok)}.tag.ko{color:var(--ko)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>

<script>
(function(){
"use strict";
var L = {"labId": "filosofia_hegel_astratto", "title": "Chi pensa astrattamente?", "eyebrow": "Filosofia · Hegel · Palestra", "tempoAtteso": 600, "caratteriAttesi": 200, "richiamo": {"title": "Per orientarti", "paras": ["Hegel (1770–1831) è il filosofo per cui la verità non sta in una parte isolata, ma nell'insieme delle relazioni. Per dirlo usa due parole che tutti conosciamo, «astratto» e «concreto», ma dà loro un senso che non è quello di tutti i giorni.", "Il testo che leggerai è diverso dalle sue opere maggiori: è un breve scritto d'occasione, pensato per un pubblico colto ma non di filosofi, e ha un tono ironico. Prendi sul serio la domanda del titolo e diffida della prima risposta che ti viene in mente."]}, "testo": {"titolo": "G.W.F. Hegel, Chi pensa astrattamente?", "fonte": "Scritto breve, pubblicato dopo la morte di Hegel. Estratto con tagli [...].", "paras": ["Pensare? Astratto? – Si salvi chi può! [...] Metafisica è la parola – come astratto, e quasi anche pensare – davanti alla quale ognuno scappa, più o meno come davanti a un appestato.", "Chi pensa astrattamente? L'uomo incolto, non quello colto. [...]", "Mi basta portare degli esempi, nei quali ognuno ammetterà che la mia tesi è contenuta. Un assassino viene condotto al luogo dell'esecuzione. Per la gente comune non è nient'altro che un assassino. Qualche signora osserva, forse, che è un uomo robusto, bello, interessante. La gente trova l'osservazione orribile: come, un assassino bello? Come si può pensare così male da chiamare bello un assassino? Non sarete molto meglio neanche voi! [...]", "Questo si chiama pensare astrattamente: non vedere nell'assassino nient'altro che questo astratto, che è un assassino, e con quest'unica qualità cancellare in lui tutto il resto del suo essere uomo. Ben diversa una raffinata e sensibile società di Lipsia: cosparse e avvolse di ghirlande di fiori la ruota e il condannato che vi era legato sopra. – Ma questa è di nuovo l'astrazione opposta. [...]", "Tutt'altro sentii una volta da una vecchia popolana, una ricoverata dell'ospizio, che uccise l'astrazione dell'assassino e lo restituì vivo all'onore. La testa mozzata era stata posta sul patibolo, e c'era il sole. «Com'è bello», disse, «che il sole della grazia di Dio faccia risplendere la testa di Binder!» – «Non sei degno che il sole ti illumini», si dice a un disgraziato con cui ce l'abbiamo. Quella donna vide che la testa dell'assassino era illuminata dal sole, e dunque ne era ancora degna.", "«Vecchia, le vostre uova sono marce», dice la cliente alla venditrice. «Cosa?», risponde questa, «le mie uova marce? Marcia sarete voi! Venite a dirlo a me, delle mie uova? Voi? Vostro padre non se lo sono mangiato i pidocchi sulla strada maestra, vostra madre non è scappata con i Francesi, vostra nonna non è morta all'ospizio? [...]» – Insomma, non le lascia addosso un filo sano. Pensa astrattamente: sussume la donna tutta intera – lo scialle, la cuffia, la camicia, e così le dita e le altre parti, e anche il padre e tutto il parentado – sotto l'unico delitto di aver trovato marce le uova; tutto in lei è tinto da capo a piedi di quelle uova marce. [...]", "L'uomo comune [...] si comporta con il servitore soltanto come con un servitore: si tiene stretto a quest'unico predicato."], "nota": "Traduzione di lavoro dal tedesco, non condotta su un'edizione italiana.", "glossario": [["incolto / colto", "in tedesco ungebildet / gebildet: chi ha o non ha ricevuto una formazione (Bildung), non chi appartiene a un ceto"], ["ruota", "strumento di esecuzione: il condannato vi veniva legato sopra"], ["ospizio", "ricovero per poveri e malati"], ["Binder", "il nome del condannato"], ["sussumere", "far rientrare un caso particolare sotto un concetto generale"], ["predicato", "ciò che si dice di un soggetto, una sua qualità"]]}, "sections": [{"kind": "info", "id": "richiamo", "title": "Per orientarti", "fromRichiamo": true}, {"kind": "text", "id": "testo", "title": "Il testo", "fase": "Fase 1 · individuale · 10 minuti", "intro": "Leggi il testo con calma: ti servirà per tutte le domande. Potrai riaprirlo in ogni momento."}, {"kind": "mc", "id": "q1", "fase": "Fase 1 · a", "title": "Che cosa vuol dire", "prompt": "Nel testo, che cosa vuol dire «pensare astrattamente»?", "options": ["Ragionare per concetti generali e teorie, lontano dai casi concreti della vita di tutti i giorni, come fanno i filosofi", "Giudicare le persone in modo severo e moralistico, invece di mostrare comprensione e indulgenza verso chi sbaglia", "Afferrare una sola qualità di qualcosa e lasciare che cancelli tutto il resto", "Usare parole difficili e termini tecnici, che la gente comune non capisce e da cui fugge come da un appestato"], "correct": 2, "spieg": "Hegel lo dice alla lettera: «non vedere nell'assassino nient'altro che questo astratto [...] e con quest'unica qualità cancellare in lui tutto il resto». Le risposte sulle teorie dei filosofi e sulle parole difficili sono il senso comune della parola, quello da cui la «bella società» scappa: il testo lo prende in giro. Quella sulla severità è una trappola: anche l'indulgenza delle signore di Lipsia, per Hegel, è astratta."}, {"kind": "classify", "id": "q2", "fase": "Fase 1 · b", "title": "Sette casi", "consegna": "Classifica ogni caso. I primi tre che incontri vengono dal testo, gli altri no.", "categories": ["Astratto per Hegel", "Astratto solo nell'uso comune", "Concreto per Hegel"], "items": [{"id": "q2_1", "text": "La gente che nel condannato vede «nient'altro che un assassino».", "correct": 0, "spieg": "È l'esempio di partenza di Hegel: una sola qualità cancella «tutto il resto del suo essere uomo»."}, {"id": "q2_2", "text": "Le signore di Lipsia che coprono di fiori la ruota e il condannato.", "correct": 0, "spieg": "Sembra l'opposto della gente comune, ma Hegel la chiama «l'astrazione opposta»: si isola un altro lato (il condannato da compatire) e si cancella il resto, compreso il delitto."}, {"id": "q2_3", "text": "La vecchia dell'ospizio che vede il sole risplendere sulla testa del giustiziato.", "correct": 2, "spieg": "Hegel dice che «uccide l'astrazione»: vede insieme il condannato e l'uomo ancora degno della luce. Nota che è una popolana: il criterio non è il ceto sociale."}, {"id": "q2_4", "text": "Un professore spiega la differenza tra sostanza e accidente solo con definizioni, senza fare esempi.", "correct": 1, "spieg": "È astratto nel senso di tutti i giorni (teorico, senza esempi), ma non riduce nessuno a una sola qualità: per Hegel non è questo il pensare astratto."}, {"id": "q2_5", "text": "Dopo un rigore sbagliato in finale, un allenatore dice di un giocatore «è uno che si scioglie nei momenti decisivi» e non lo fa più tirare.", "correct": 0, "spieg": "Un solo episodio diventa l'unico predicato del giocatore, come le uova marce per la cliente del mercato."}, {"id": "q2_6", "text": "Una ragazza studia un manuale di logica pieno di simboli e formule.", "correct": 1, "spieg": "Simboli e formule sono «astratti» nell'uso comune; nessuno però viene ridotto a un solo tratto."}, {"id": "q2_7", "text": "Un medico, prima di scegliere la cura, oltre alle analisi chiede al paziente come vive, che lavoro fa, che cosa lo preoccupa.", "correct": 2, "spieg": "Tiene insieme più determinazioni della persona invece di fermarsi a una: è il contrario dell'astrazione hegeliana."}]}, {"kind": "essay", "id": "q3", "fase": "Fase 1 · c", "title": "Con parole tue", "prompt": "In due o tre righe: che cosa vuol dire, per Hegel, pensare astrattamente? E che cosa vorrebbe dire, al contrario, pensare in concreto?", "min": 40, "max": 1500, "righe": 5, "checklist": ["Pensare astrattamente vuol dire prendere una sola determinazione (una qualità, un predicato) di qualcosa o di qualcuno e lasciare che valga per il tutto, cancellando il resto.", "Non ha a che fare con la teoria o con le parole difficili: è quasi il contrario dell'uso comune della parola.", "Si può essere astratti anche «in positivo»: idealizzare o compatire a senso unico è l'astrazione opposta (Lipsia).", "Pensare in concreto vuol dire tenere insieme le molte determinazioni di una cosa o di una persona.", "Per chi studia latino: abstractus viene da abs-trahere, «tirato via, separato»; concretus da con-crescere, «cresciuto insieme»."], "checklistTitle": "Controlla se nella tua risposta c'è"}]};
var KEY = "addestr_state_" + L.labId;
var TIP = "Analizzare testi";
var SECS = L.sections;
var S = load() || { i:0, a:{}, done:false };
var app = document.getElementById("app");
var registered = true;

function load(){ try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function hash(s){ var h = 2166136261; for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function order(n, seed){ var a=[],i; for(i=0;i<n;i++)a.push(i); var x=hash(seed)||1; for(i=n-1;i>0;i--){ x^=x<<13; x^=x>>>17; x^=x<<5; x>>>=0; var j=x%(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function isChoice(s){ return s.kind==="mc" || s.kind==="classify"; }
var LAST_CHOICE = -1; SECS.forEach(function(s,k){ if (isChoice(s)) LAST_CHOICE = k; });

function header(){
  var h = el("header");
  h.appendChild(el("p","eyebrow",L.eyebrow));
  h.appendChild(el("h1",null,L.title));
  var c = el("span","chip",TIP); h.appendChild(c);
  var p = el("div","progress"); var bar = el("div"); p.appendChild(bar);
  bar.style.width = (S.done ? 100 : Math.round(100*S.i/SECS.length)) + "%";
  p.setAttribute("role","progressbar"); p.setAttribute("aria-label","Avanzamento");
  p.setAttribute("aria-valuemin","0"); p.setAttribute("aria-valuemax","100"); p.setAttribute("aria-valuenow", S.done?100:Math.round(100*S.i/SECS.length));
  h.appendChild(p);
  return h;
}
function textBlock(){
  var d = el("div");
  var q = el("div","hegel");
  L.testo.paras.forEach(function(t){ q.appendChild(el("p",null,t)); });
  d.appendChild(el("p","fase",L.testo.titolo));
  d.appendChild(q);
  d.appendChild(el("p","warn",L.testo.nota));
  var dl = el("dl","gloss");
  L.testo.glossario.forEach(function(g){ dl.appendChild(el("dt",null,g[0])); dl.appendChild(el("dd",null,g[1])); });
  var gd = el("details"); var gs = el("summary",null,"Parole da tenere presenti"); gd.appendChild(gs);
  var gi = el("div","inner"); gi.appendChild(dl); gd.appendChild(gi); d.appendChild(gd);
  return d;
}
function rereadBox(){
  var d = el("details"); d.appendChild(el("summary",null,"Rileggi il testo"));
  var i = el("div","inner"); i.appendChild(textBlock()); d.appendChild(i); return d;
}
function catText(s, k){ return s.kind==="mc" ? s.options[k] : s.categories[k]; }

function renderChoiceItem(card, s, it, prompt, labels, correctIdx, spieg, ordered){
  var box = el("div","item");
  box.appendChild(el("p","q",prompt));
  var chosen = S.a[it];
  var ids = ordered || labels.map(function(_,k){return k;});
  ids.forEach(function(k){
    var b = el("button","opt",labels[k]); b.type="button";
    b.setAttribute("aria-pressed", chosen===k ? "true":"false");
    if (chosen !== undefined){ b.disabled = true; if (k===correctIdx) b.classList.add("right"); else if (k===chosen) b.classList.add("wrong"); }
    b.onclick = function(){ if (S.a[it]!==undefined) return; S.a[it]=k; persist(); render(it); };
    box.appendChild(b);
  });
  if (chosen !== undefined){
    var ok = chosen===correctIdx;
    var fb = el("div","fb "+(ok?"ok":"ko")); fb.setAttribute("role","status");
    fb.appendChild(el("b",null, ok ? "Giusto." : "Non proprio: la risposta è «"+labels[correctIdx]+"»."));
    fb.appendChild(document.createTextNode(spieg));
    box.appendChild(fb);
  }
  box.id = "it_"+it;
  card.appendChild(box);
}

function sectionComplete(s){
  if (s.kind==="mc") return S.a[s.id]!==undefined;
  if (s.kind==="classify") return s.items.every(function(it){ return S.a[it.id]!==undefined; });
  if (s.kind==="essay") return (S.a[s.id]||"").trim().length >= s.min;
  if (s.kind==="selfcheck") return s.items.every(function(it){ return S.a[it.id]!==undefined; });
  return true;
}

function render(focusId){
  app.innerHTML = "";
  app.appendChild(header());
  if (!registered) app.appendChild(el("div","notice","Registro non raggiungibile: puoi svolgere comunque l'esercitazione."));
  if (S.done) return renderDone();
  var s = SECS[S.i];
  var nx = null, upd = null;
  var card = el("section","card");
  if (s.fase) card.appendChild(el("p","fase",s.fase));
  card.appendChild(el("h2",null,s.title));

  if (s.kind==="info" && s.fromRichiamo){
    L.richiamo.paras.forEach(function(t){ card.appendChild(el("p",null,t)); });
  } else if (s.kind==="info"){
    var bx = el("div","box");
    s.paras.forEach(function(t){ bx.appendChild(el("p",null,t)); });
    var q = el("div","hegel"); q.appendChild(el("p",null,s.quote)); bx.appendChild(q);
    bx.appendChild(el("p","warn",s.orange));
    card.appendChild(bx);
  } else if (s.kind==="text"){
    card.appendChild(el("p",null,s.intro));
    card.appendChild(textBlock());
  } else {
    card.appendChild(rereadBox());
    if (s.kind==="mc"){
      renderChoiceItem(card, s, s.id, s.prompt, s.options, s.correct, s.spieg, null /* ordine fisso, già mescolato nella sorgente: coincide con la scheda */);
    } else if (s.kind==="classify"){
      card.appendChild(el("p",null,s.consegna));
      s.items.forEach(function(it,n){ renderChoiceItem(card, s, it.id, (n+1)+". "+it.text, s.categories, it.correct, it.spieg); });
    } else if (s.kind==="essay"){
      var lab = el("label",null,s.prompt); lab.setAttribute("for","ta_"+s.id); lab.style.fontWeight="600"; lab.style.display="block"; lab.style.marginBottom="8px";
      card.appendChild(lab);
      var t = el("textarea"); t.id="ta_"+s.id; t.maxLength=s.max; t.value=S.a[s.id]||"";
      var c = el("div","count");
      upd = function(){ c.textContent = t.value.length+" / "+s.max+" caratteri" + (t.value.trim().length < s.min ? " · scrivi almeno "+s.min+" caratteri per proseguire" : ""); if (nx) nx.disabled = !sectionComplete(s); };
      t.oninput = function(){ S.a[s.id]=t.value; persist(); upd(); };
      card.appendChild(t); card.appendChild(c);
      if (s.noSolution) card.appendChild(el("p","warn",s.noSolution));
    } else if (s.kind==="selfcheck"){
      card.appendChild(el("p",null,s.intro));
      s.items.forEach(function(it){
        var box = el("div","item"); box.appendChild(el("p","q",it.text));
        s.options.forEach(function(o,k){
          var b = el("button","opt",o); b.type="button"; b.setAttribute("aria-pressed", S.a[it.id]===k?"true":"false");
          b.onclick=function(){ S.a[it.id]=k; persist(); render(it.id); };
          box.appendChild(b);
        });
        card.appendChild(box);
      });
      if (sectionComplete(s)){ var f = el("div","fb neutral"); f.textContent = s.after; card.appendChild(f); }
    }
  }

  // navigazione
  var nav = el("div","nav");
  var canBack = S.i>0 && S.i !== LAST_CHOICE+1;
  if (canBack){ var bk = el("button","btn sec","Indietro"); bk.type="button"; bk.onclick=function(){ S.i--; persist(); render(); window.scrollTo(0,0); }; nav.appendChild(bk); }
  nav.appendChild(el("span","sp"));
  var last = S.i===SECS.length-1;
  nx = el("button","btn", last ? "Consegna" : "Avanti"); nx.type="button";
  nx.disabled = !sectionComplete(s);
  nx.onclick = function(){ if (!sectionComplete(s)) return; if (last) return consegna(); S.i++; persist(); render(); window.scrollTo(0,0); };
  nav.appendChild(nx);
  if (upd) upd();
  if (S.i===LAST_CHOICE+1 && LAST_CHOICE>=0) card.appendChild(el("div","notice","Le risposte a scelta sono chiuse: da qui non si torna indietro, così le risposte già date restano quelle che hai scelto prima di vedere le soluzioni."));
  if (S.i===LAST_CHOICE && sectionComplete(s)) card.appendChild(el("div","notice","Attenzione: dopo «Avanti» non potrai più tornare a questa parte."));
  card.appendChild(nav);
  app.appendChild(card);
  if (focusId){ var f2 = document.getElementById("it_"+focusId); if (f2){ var b2 = f2.querySelector(".fb") || f2; b2.scrollIntoView({block:"nearest"}); } }
}

function answers(){
  var out = [];
  SECS.forEach(function(s){
    if (s.kind==="mc" && S.a[s.id]!==undefined) out.push({id:s.id, prompt:s.prompt.slice(0,300), type:"mc", answer:s.options[S.a[s.id]], correct:S.a[s.id]===s.correct});
    if (s.kind==="classify") s.items.forEach(function(it){ if (S.a[it.id]!==undefined) out.push({id:it.id, prompt:it.text.slice(0,300), type:"mc", answer:s.categories[S.a[it.id]], correct:S.a[it.id]===it.correct}); });
    if (s.kind==="essay" && (S.a[s.id]||"").trim()) out.push({id:s.id, prompt:s.prompt.slice(0,300), type:"essay", answer:String(S.a[s.id]).slice(0,4000), correct:null});
    if (s.kind==="selfcheck") s.items.forEach(function(it){ if (S.a[it.id]!==undefined) out.push({id:it.id, prompt:it.text.slice(0,300), type:"essay", answer:s.options[S.a[it.id]], correct:null}); });
  });
  return out;
}
function score(){ var a = answers().filter(function(x){return x.type==="mc";}); if (!a.length) return null; return Math.round(100*a.filter(function(x){return x.correct;}).length/a.length); }

function consegna(){
  S.done = true; S.score = score(); persist();
  try { if (window.Addestramento && Addestramento.completa) Addestramento.completa(answers(), S.score); } catch(e){ registered = false; }
  render(); window.scrollTo(0,0);
}

function renderDone(){
  var card = el("section","card");
  card.appendChild(el("h2",null,"Consegnato: ecco la correzione"));
  var mcs = answers().filter(function(x){return x.type==="mc";});
  var ok = mcs.filter(function(x){return x.correct;}).length;
  card.appendChild(el("p","score","Risposte a scelta corrette: "+ok+" su "+mcs.length));
  SECS.forEach(function(s){
    if (s.kind==="mc" || s.kind==="classify"){
      var list = s.kind==="mc" ? [{id:s.id,text:s.prompt,correct:s.correct,spieg:s.spieg}] : s.items;
      var h = el("p","fase",(s.fase||"")+" · "+s.title); h.style.marginTop="14px"; card.appendChild(h);
      list.forEach(function(it){
        var r = el("div","rev"); var mine = S.a[it.id]; var good = mine===it.correct;
        r.appendChild(el("p","q",it.text));
        var p = el("p"); var tg = el("span","tag "+(good?"ok":"ko"), good?"✓ Giusto. ":"✗ Non proprio. "); p.appendChild(tg);
        p.appendChild(document.createTextNode("Tua risposta: «"+catText(s,mine)+"»"+(good?"":" · Risposta attesa: «"+catText(s,it.correct)+"»")));
        r.appendChild(p); r.appendChild(el("p",null,it.spieg)); card.appendChild(r);
      });
    } else if (s.kind==="essay"){
      var h2 = el("p","fase",(s.fase||"")+" · "+s.title); h2.style.marginTop="14px"; card.appendChild(h2);
      var r2 = el("div","rev"); r2.appendChild(el("p","q",s.prompt)); r2.appendChild(el("div","mine",S.a[s.id]||""));
      if (s.checklist){ r2.appendChild(el("p","tag",s.checklistTitle+":")); var ul = el("ul","check"); s.checklist.forEach(function(c){ ul.appendChild(el("li",null,c)); }); r2.appendChild(ul); }
      if (s.noSolution) r2.appendChild(el("p","warn",s.noSolution));
      card.appendChild(r2);
    } else if (s.kind==="selfcheck"){
      var h3 = el("p","fase",(s.fase||"")+" · "+s.title); h3.style.marginTop="14px"; card.appendChild(h3);
      s.items.forEach(function(it){ var r3 = el("div","rev"); r3.appendChild(el("p","q",it.text)); r3.appendChild(el("p",null,"Tua risposta: «"+s.options[S.a[it.id]]+"»")); card.appendChild(r3); });
      card.appendChild(el("div","fb neutral",s.after));
    }
  });
  var nav = el("div","nav"); nav.appendChild(el("span","sp"));
  var again = el("button","btn sec","Ricomincia da capo"); again.type="button";
  again.onclick = function(){ S = {i:0,a:{},done:false}; persist(); render(); window.scrollTo(0,0); };
  nav.appendChild(again); card.appendChild(nav);
  app.appendChild(card);
}

function start(){
  if (window.Addestramento && typeof Addestramento.start === "function"){
    try {
      Addestramento.start({ labId:L.labId, title:L.title, tempoAtteso:L.tempoAtteso, caratteriAttesi:L.caratteriAttesi, onReady:function(){ render(); } });
      return;
    } catch(e){}
  }
  registered = false; render();
}
start();
})();
</script>
