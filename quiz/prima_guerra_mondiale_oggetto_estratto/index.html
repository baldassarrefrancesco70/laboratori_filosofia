const $=s=>document.querySelector(s);
let filtro="tutte",ordine=[],visibili=[],corrente=-1;
function mescola(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function disegna(){
  visibili=ordine.filter(c=>filtro==="tutte"||c.s===filtro);
  const g=$("#griglia");g.innerHTML="";
  if(!visibili.length)g.innerHTML='<p class="vuoto">Nessuna carta con questo filtro.</p>';
  visibili.forEach((c,i)=>{
    const b=document.createElement("button");b.className="carta";b.type="button";
    b.innerHTML='<div class="riq"><img loading="lazy" alt=""></div><p></p>';
    b.querySelector("img").src="img/"+c.f+".jpg";
    b.querySelector("img").alt="Immagine "+(i+1);
    b.querySelector("p").textContent=c.cap;
    b.onclick=()=>apri(i);g.appendChild(b);
  });
  $("#conta").textContent=visibili.length+(visibili.length===1?" immagine":" immagini");
}
function blocco(t,cont){const f=document.createDocumentFragment();const h=document.createElement("h3");h.textContent=t;f.appendChild(h);f.appendChild(cont);return f}
function ul(arr){const u=document.createElement("ul");arr.forEach(t=>{const l=document.createElement("li");l.textContent=t;u.appendChild(l)});return u}
function premi(b,on){b.setAttribute("aria-pressed",on)}
function apri(i){
  corrente=i;const c=visibili[i];
  $("#f-img").src="img/"+c.f+".jpg";$("#f-img").alt="Immagine estratta";
  const cap=$("#f-cap");cap.textContent=c.cap;cap.hidden=true;premi($("#b-cap"),false);$("#b-cap").textContent="Mostra didascalia";
  $("#finestra").classList.remove("con-spunti");premi($("#b-spunti"),false);
  const s=$("#spunti");s.innerHTML="";
  const p=document.createElement("p");p.textContent=c.p1;s.appendChild(blocco("Il contesto",p));
  if(c.p2&&c.p2.length)s.appendChild(blocco("Collegamenti",ul(c.p2)));
  if(c.p3&&c.p3.length)s.appendChild(blocco("Da discutere",ul(c.p3)));
  const fo=document.createElement("p");fo.className="fonte";fo.textContent=(c.s==="n"?"Nucleo":"Dettaglio")+" · Immagine: "+c.src;s.appendChild(fo);
  $("#velo").classList.add("aperto");$("#b-cap").focus();
}
function chiudi(){$("#velo").classList.remove("aperto");corrente=-1}
document.querySelectorAll("[data-filtro]").forEach(b=>b.onclick=()=>{filtro=b.dataset.filtro;document.querySelectorAll("[data-filtro]").forEach(x=>premi(x,x===b));disegna()});
$("#mescola").onclick=()=>{ordine=mescola(CARTE);disegna()};
$("#didascalie").onclick=e=>{const on=document.body.classList.toggle("con-didascalie");premi(e.target,on);e.target.textContent=on?"Nascondi didascalie":"Mostra didascalie"};
$("#b-cap").onclick=e=>{const cap=$("#f-cap");cap.hidden=!cap.hidden;premi(e.target,!cap.hidden);e.target.textContent=cap.hidden?"Mostra didascalia":"Nascondi didascalia"};
$("#b-spunti").onclick=e=>{const on=$("#finestra").classList.toggle("con-spunti");premi(e.target,on)};
$("#estrai").onclick=()=>{if(visibili.length)apri(Math.floor(Math.random()*visibili.length))};
$("#prec").onclick=()=>apri((corrente-1+visibili.length)%visibili.length);
$("#succ").onclick=()=>apri((corrente+1)%visibili.length);
$("#chiudi").onclick=chiudi;
$("#velo").onclick=e=>{if(e.target.id==="velo"||e.target.classList.contains("imm"))chiudi()};
document.addEventListener("keydown",e=>{if(corrente<0)return;if(e.key==="Escape")chiudi();if(e.key==="ArrowRight")$("#succ").click();if(e.key==="ArrowLeft")$("#prec").click()});
ordine=mescola(CARTE);disegna();
</script>
