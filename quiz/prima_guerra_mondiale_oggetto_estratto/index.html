{f:"dc-1914-27-d-sarajevo",t:2,s:"n",cap:"Copertina della «Domenica del Corriere», disegno di Achille Beltrame",
p1:"L’attentato di Sarajevo, 28 giugno 1914: Gavrilo Princip uccide l’arciduca Francesco Ferdinando, erede al trono asburgico, e la moglie Sofia. Di per sé è una crisi grave, ma non nuova.",
p2:["Che cosa trasforma questa crisi in una guerra europea? Cerca la decisione presa a Berlino il 5-6 luglio: la «cambiale in bianco».","Guarda indietro: l’annessione della Bosnia-Erzegovina (1908), le guerre balcaniche, la Mano nera."],
p3:["È un disegno, non una fotografia: dell’attentato non esiste un’immagine autentica. Che cosa ha scelto di mostrare l’illustratore?","Guerra voluta o catastrofe involontaria? È la questione che divide Fritz Fischer e Christopher Clark."],
src:"Wikimedia Commons, pubblico dominio"},
{f:"ultimatum",t:2,s:"n",cap:"Prima pagina di «Die Neue Zeitung», Vienna",

p2:["Quale punto la Serbia rifiuta, e su chi conta per farlo? Segui il filo fino alla mobilitazione russa del 30 luglio.","Per diversi storici l’ultimatum era scritto perché fosse respinto. Che cosa cambia nella responsabilità di Vienna?"],
p3:["Chi parla in questa pagina, a chi si rivolge e con quale scopo? Un giornale viennese racconta la crisi dal punto di vista della propria parte."],

{f:"balkan-troubles1",t:1,s:"d",cap:"Vignetta della rivista satirica britannica «Punch»",

p2:["Una volta iniziate le mobilitazioni, quale margine di scelta resta ai governi?","Perché nell’agosto 1914 l’Italia resta neutrale?","Trova sulla carta le minoranze dell’Austria-Ungheria: che cosa accade loro dopo il 1918?"],
p3:["«Le alleanze non hanno causato la guerra: hanno impedito che restasse locale». Sei d’accordo? Con quali argomenti?"],

p2:["Riconosci Gran Bretagna, Francia, Germania, Austria-Ungheria e Russia? Come è rappresentata ciascuna?","Collega la carta al nazionalismo e alla propaganda che trasforma il nemico in un essere disumano."],
p3:["È una fonte di propaganda: che cosa dice del punto di vista britannico, e che cosa tace?"],

p2:["Perché nel 1914 l’alleanza vale per l’Italia «solo sulla carta»?","Dalla Triplice al Patto di Londra (26 aprile 1915): come cambia la posizione dell’Italia?"],

const TAPPE={1:"Prima della faglia",2:"La crisi di luglio",3:"I caratteri della guerra",4:"Quattro anni di guerra",5:"L’Italia in guerra",6:"I trattati di pace"};
const $=s=>document.querySelector(s);
let filtro="tutte",tappa=0,ordine=[],visibili=[],corrente=-1,capMostrata=false;
const sel=$("#tappa");
for(const k in TAPPE){const o=document.createElement("option");o.value=k;o.textContent=k+". "+TAPPE[k];sel.appendChild(o)}
function mescola(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function disegna(){
  visibili=ordine.filter(c=>(filtro==="tutte"||c.s===filtro)&&(!tappa||c.t===tappa));
  const g=$("#griglia");g.innerHTML="";
  if(!visibili.length){g.innerHTML='<p class="vuoto">Nessuna carta con questi filtri.</p>'}
  visibili.forEach((c,i)=>{
    const b=document.createElement("button");b.className="carta";b.type="button";
    b.innerHTML='<img loading="lazy" src="img/'+c.f+'.jpg" alt=""><p></p>';
    b.querySelector("p").textContent=c.cap;
    b.querySelector("img").alt=c.cap;
    b.onclick=()=>apri(i);g.appendChild(b);
  });
  $("#conta").textContent=visibili.length+(visibili.length===1?" carta":" carte");
}
function lista(titolo,arr){if(!arr||!arr.length)return"";const d=document.createElement("div");const h=document.createElement("h3");h.textContent=titolo;d.appendChild(h);const u=document.createElement("ul");arr.forEach(t=>{const l=document.createElement("li");l.textContent=t;u.appendChild(l)});d.appendChild(u);return d}
function apri(i){
  corrente=i;const c=visibili[i];capMostrata=false;
  $("#f-img").src="img/"+c.f+".jpg";$("#f-img").alt=c.cap;
  $("#f-et").innerHTML="";
  const e1=document.createElement("span");e1.className="et";e1.textContent="Tappa "+c.t+" · "+TAPPE[c.t];
  const e2=document.createElement("span");e2.className="et "+c.s;e2.textContent=c.s==="n"?"Nucleo":"Dettaglio";
  $("#f-et").append(e1,e2);
  scriviCap();
  $("#f-p1").open=false;$("#f-p1t").textContent=c.p1;
  const p2=$("#f-p2"),p3=$("#f-p3");p2.innerHTML="";p3.innerHTML="";
  const a=lista("Collegamenti · Percorso 2",c.p2),b=lista("Questioni aperte · Percorso 3",c.p3);
  if(a)p2.appendChild(a);if(b)p3.appendChild(b);
  $("#f-src").textContent="Immagine: "+c.src;
  const nascondi=document.body.classList.contains("senza-didascalie");
  $("#f-et").style.display=nascondi?"none":"flex";
  $("#velo").classList.add("aperto");$("#chiudi").focus();
}
function scriviCap(){
  const c=visibili[corrente],el=$("#f-cap");el.innerHTML="";
  if(document.body.classList.contains("senza-didascalie")&&!capMostrata){
    const b=document.createElement("button");b.className="btn";b.textContent="Mostra didascalia";
    b.onclick=()=>{capMostrata=true;$("#f-et").style.display="flex";scriviCap()};el.appendChild(b);
  }else{el.textContent=c.cap}
}
function chiudi(){$("#velo").classList.remove("aperto");corrente=-1}
document.querySelectorAll("[data-filtro]").forEach(b=>b.onclick=()=>{filtro=b.dataset.filtro;document.querySelectorAll("[data-filtro]").forEach(x=>x.setAttribute("aria-pressed",x===b));disegna()});
sel.onchange=()=>{tappa=+sel.value;disegna()};
$("#mescola").onclick=()=>{ordine=mescola(CARTE);disegna()};
$("#didascalie").onclick=e=>{const on=document.body.classList.toggle("senza-didascalie");e.target.setAttribute("aria-pressed",on);e.target.textContent=on?"Mostra didascalie":"Nascondi didascalie"};
$("#estrai").onclick=()=>{if(visibili.length)apri(Math.floor(Math.random()*visibili.length))};
$("#prec").onclick=()=>apri((corrente-1+visibili.length)%visibili.length);
$("#succ").onclick=()=>apri((corrente+1)%visibili.length);
$("#chiudi").onclick=chiudi;
$("#velo").onclick=e=>{if(e.target.id==="velo")chiudi()};
document.addEventListener("keydown",e=>{if(corrente<0)return;if(e.key==="Escape")chiudi();if(e.key==="ArrowRight")$("#succ").click();if(e.key==="ArrowLeft")$("#prec").click()});
ordine=mescola(CARTE);disegna();
</script>
