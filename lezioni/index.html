<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lezioni interattive</title>
<link rel="stylesheet" href="../lib/aula.v1.css">
<style>
  body.portale{margin:0;background:#F6F6F4;color:var(--testo);font-family:var(--sans);font-size:17px}
  .p-testata{background:var(--rosso);color:#fff;padding:22px 32px}
  .p-testata h1{margin:0;font-size:30px}
  .p-testata p{margin:4px 0 0;opacity:.9}
  main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  .pin{max-width:360px;margin:60px auto;text-align:center}
  .pin input{font-size:32px;width:180px;text-align:center;letter-spacing:10px;padding:8px;border:2px solid var(--bordo);border-radius:8px}
  .pin .err{color:var(--rosso-scuro);min-height:1.4em;margin-top:10px;font-weight:700}
  h2.materia{font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--tenue);margin:30px 0 8px}
  h3.anno{font-size:22px;margin:18px 0 10px}
  .lez{background:#fff;border:1px solid var(--bordo);border-radius:10px;padding:16px 18px;margin-bottom:12px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .lez .t{font-weight:700;font-size:19px}
  .lez .d{color:var(--tenue);font-size:15px;margin-top:4px;max-width:640px}
  .classi{display:flex;gap:10px;flex-wrap:wrap}
  .classi a{display:inline-block;min-width:64px;text-align:center;font-weight:700;font-size:20px;padding:12px 16px;border-radius:8px;background:var(--rosso);color:#fff;text-decoration:none}
  .classi a:hover,.classi a:focus{background:var(--rosso-scuro)}
  .classi .vuoto{color:var(--tenue);font-size:14px}
  .gestione{margin-top:40px;border-top:2px solid var(--bordo);padding-top:20px}
  .gestione h2{font-size:22px;margin:0 0 6px}
  .gestione .nota{color:var(--tenue);font-size:15px;margin:0 0 14px}
  button.p{font:inherit;font-weight:700;padding:9px 16px;border-radius:8px;border:2px solid var(--rosso);background:#fff;color:var(--rosso-scuro);cursor:pointer}
  button.p.pieno{background:var(--rosso);color:#fff}
  button.p:disabled{opacity:.5;cursor:default}
  .utente{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  table.sess{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bordo);border-radius:10px;overflow:hidden;margin:6px 0 18px}
  table.sess th,table.sess td{padding:9px 12px;border-bottom:1px solid #EEE;text-align:left;font-size:15px;vertical-align:middle}
  table.sess th{background:#FAFAFA;font-size:13px;color:var(--tenue);text-transform:uppercase;letter-spacing:.5px}
  table.sess td.az{text-align:right;white-space:nowrap}
  table.sess td.az button{margin-left:6px;font-size:14px;padding:6px 10px}
  .conferma{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .conferma input{font-family:ui-monospace,Menlo,monospace;font-size:15px;width:120px;padding:5px 8px;text-transform:uppercase}
  .msg{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:15px}
  .msg.err{background:#FDECEC;color:#8A1414}
  .msg.ok{background:#EAF5EA;color:#1E5E22}
  .lez-g{font-weight:700;margin-top:18px}
  .tenue{color:var(--tenue)}
  @media (max-width:640px){.p-testata{padding:16px}.lez{display:block}.classi{margin-top:12px}}
</style>
</head>
<body class="portale">
<header class="p-testata"><h1>Lezioni interattive</h1><p>Filosofia e storia · Liceo Classico «G.B. Vico»</p></header>
<main id="main"><p class="tenue">Caricamento…</p></main>
<script>
(function () {
  'use strict';
  var PIN = '1973';
  var DOCENTE = 'francescobaldassarre.docente@convittogbvico.edu.it';
  var DB_PREDEFINITO = 'https://laboratorio-vico-default-rtdb.europe-west1.firebasedatabase.app';
  var FIREBASE = {
    apiKey: 'AIzaSyAb01kyYdSna57OYJD-q5OVMeWQwhKAH0g',
    authDomain: 'laboratorio-vico.firebaseapp.com',
    projectId: 'laboratorio-vico'
  };
  var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var param = function (n) { return new URLSearchParams(location.search).get(n); };
  var DB = (param('db') || DB_PREDEFINITO).replace(/\/+$/, '');
  var PROVA = !!param('db'); // database di prova: accesso simulato, mai sul database vero
  var main = document.getElementById('main');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function leggiSS(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function scriviSS(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* niente */ } }

  // anno scolastico: da settembre a agosto → «2627» per il 2026/27
  function annoScolastico(d) {
    d = d || new Date();
    var a = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
    return String(a % 100).padStart(2, '0') + String((a + 1) % 100).padStart(2, '0');
  }
  var AS = annoScolastico();
  var AS_LEGGIBILE = '20' + AS.slice(0, 2) + '/' + AS.slice(2);
  function codiceSessione(classe) { return (classe + AS).toUpperCase().replace(/[^A-Z0-9]/g, ''); }

  // ------------------------------------------------------------------ PIN
  function chiediPin() {
    main.innerHTML = '<form class="pin"><p>PIN del docente</p><input type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">' +
      '<div class="err"></div><button class="p pieno" type="submit">Entra</button></form>';
    var f = main.querySelector('form'), i = f.querySelector('input');
    i.focus();
    f.onsubmit = function (e) {
      e.preventDefault();
      if (i.value === PIN) { scriviSS('portale-lezioni:pin', '1'); carica(); }
      else { f.querySelector('.err').textContent = 'PIN errato'; i.value = ''; i.focus(); }
    };
  }

  // ------------------------------------------------------------------ elenco lezioni
  var INDICE = [], CLASSI = {};
  function carica() {
    Promise.all([
      fetch('indice.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('indice.json: HTTP ' + r.status); return r.json(); }),
      fetch('classi.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('classi.json: HTTP ' + r.status); return r.json(); })
    ]).then(function (x) {
      INDICE = x[0].lezioni || []; CLASSI = x[1] || {};
      disegna();
    }).catch(function (e) {
      main.innerHTML = '<div class="msg err">Non riesco a leggere l’elenco delle lezioni (' + esc(e.message) + ').</div>';
    });
  }

  var ORDINE_ANNI = ['prima', 'seconda', 'terza', 'quarta', 'quinta'];
  function disegna() {
    main.innerHTML = '';
    main.appendChild(el('p', 'tenue', 'Anno scolastico ' + AS_LEGGIBILE + '. Clicca la classe: la lezione si apre con il QR per gli studenti. ' +
      'Riaprendo la stessa classe, anche da un altro computer, la lezione riprende dal passo in cui ti eri fermato.'));
    var perMateria = {};
    INDICE.forEach(function (l) { (perMateria[l.materia || 'altro'] = perMateria[l.materia || 'altro'] || []).push(l); });
    Object.keys(perMateria).sort().forEach(function (m) {
      main.appendChild(el('h2', 'materia', esc(m)));
      var perAnno = {};
      perMateria[m].forEach(function (l) { (perAnno[l.classe || ''] = perAnno[l.classe || ''] || []).push(l); });
      Object.keys(perAnno).sort(function (a, b) { return ORDINE_ANNI.indexOf(a) - ORDINE_ANNI.indexOf(b); }).forEach(function (anno) {
        main.appendChild(el('h3', 'anno', anno ? 'Classe ' + esc(anno) : 'Senza classe'));
        perAnno[anno].forEach(function (l) {
          var box = el('div', 'lez');
          box.appendChild(el('div', '', '<div class="t">' + esc(l.titolo) + '</div><div class="d">' + esc(l.descrizione) + '</div>'));
          var cl = el('div', 'classi');
          var elenco = CLASSI[anno] || [];
          if (!elenco.length) cl.innerHTML = '<span class="vuoto">Nessuna classe per «' + esc(anno || '?') + '» in classi.json</span>';
          elenco.forEach(function (c) {
            var a = el('a', '', esc(c));
            a.href = l.file + '?s=' + encodeURIComponent(codiceSessione(c)) + (PROVA ? '&db=' + encodeURIComponent(DB) : '');
            a.target = '_blank'; a.rel = 'noopener';
            a.title = 'Apri per la ' + c + ' (sessione ' + codiceSessione(c) + ')';
            cl.appendChild(a);
          });
          box.appendChild(cl);
          main.appendChild(box);
        });
      });
    });
    disegnaGestione();
  }

  // ------------------------------------------------------------------ gestione risposte (accesso Google)
  var gest, token = null, utente = null, auth = null;
  function disegnaGestione() {
    gest = el('section', 'gestione');
    gest.innerHTML = '<h2>Risposte degli studenti</h2>' +
      '<p class="nota">Scaricare le risposte in CSV o cancellarle richiede l’accesso con l’account della scuola (' + esc(DOCENTE) + '). ' +
      'L’accesso dura finché resta aperta questa scheda.</p><div class="corpo-g"></div>';
    main.appendChild(gest);
    mostraAccesso();
  }
  function corpoG() { return gest.querySelector('.corpo-g'); }
  function messaggio(tipo, testo) { var m = el('div', 'msg ' + tipo, esc(testo)); corpoG().prepend(m); setTimeout(function () { m.remove(); }, 8000); }

  function mostraAccesso(errore) {
    corpoG().innerHTML = (errore ? '<div class="msg err">' + esc(errore) + '</div>' : '') +
      '<button class="p pieno accedi" type="button">Accedi con Google</button>' +
      (PROVA ? ' <button class="p prova" type="button">Accesso di prova (solo database di prova)</button>' : '');
    corpoG().querySelector('.accedi').onclick = accediGoogle;
    var pr = corpoG().querySelector('.prova');
    if (pr) pr.onclick = function () { token = 'prova'; utente = { email: DOCENTE + ' (prova)' }; mostraSessioni(); };
  }

  function caricaScript(src) {
    return new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { ko(new Error('non riesco a caricare ' + src)); }; document.head.appendChild(s); });
  }
  function preparaAuth() {
    if (auth) return Promise.resolve(auth);
    return caricaScript(SDK + 'firebase-app-compat.js').then(function () { return caricaScript(SDK + 'firebase-auth-compat.js'); }).then(function () {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE);
      auth = firebase.auth();
      return auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).then(function () { return auth; });
    });
  }
  function accediGoogle() {
    preparaAuth().then(function (a) {
      var prov = new firebase.auth.GoogleAuthProvider();
      prov.setCustomParameters({ hd: 'convittogbvico.edu.it', prompt: 'select_account' });
      return a.signInWithPopup(prov);
    }).then(function (r) {
      if (!r.user || r.user.email !== DOCENTE) {
        var e = r.user ? r.user.email : '?';
        return auth.signOut().then(function () { mostraAccesso('Hai fatto l’accesso come ' + e + ': serve ' + DOCENTE + '.'); });
      }
      utente = r.user;
      return r.user.getIdToken().then(function (t) { token = t; mostraSessioni(); });
    }).catch(function (e) {
      var testo = e && e.code === 'auth/unauthorized-domain' ?
        'Questo indirizzo non è tra i domini autorizzati di Firebase: aggiungi ' + location.hostname + ' in Authentication › Impostazioni › Domini autorizzati.' :
        'Accesso non riuscito: ' + (e && (e.code || e.message) || e);
      mostraAccesso(testo);
    });
  }
  function esci() {
    token = null; utente = null;
    (auth ? auth.signOut() : Promise.resolve()).then(function () { mostraAccesso(); });
  }
  function rinnovaToken() {
    if (!auth || !auth.currentUser) return Promise.resolve(token);
    return auth.currentUser.getIdToken().then(function (t) { token = t; return t; });
  }
  function rest(percorso, opz) {
    opz = opz || {};
    return rinnovaToken().then(function (t) {
      var u = DB + '/' + percorso + '.json?auth=' + encodeURIComponent(t) + (opz.shallow ? '&shallow=true' : '');
      return fetch(u, { method: opz.metodo || 'GET', cache: 'no-store' });
    }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error('permesso negato dal database (controlla le regole)');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function etichettaSessione(codice) {
    var m = codice.match(/^([0-9][A-Z])([0-9]{4})$/);
    if (m) return m[1] + ' · a.s. 20' + m[2].slice(0, 2) + '/' + m[2].slice(2);
    return 'codice ' + codice;
  }

  function mostraSessioni() {
    var c = corpoG();
    c.innerHTML = '<div class="utente"><span>Accesso: <b>' + esc(utente.email) + '</b></span><button class="p esci" type="button">Esci</button></div><div class="tab"></div>';
    c.querySelector('.esci').onclick = esci;
    var tab = c.querySelector('.tab');
    INDICE.filter(function (l) { return l.percorso; }).forEach(function (l) {
      tab.appendChild(el('div', 'lez-g', esc(l.titolo)));
      var t = el('table', 'sess', '<thead><tr><th>Sessione</th><th>Studenti</th><th>Attività con risposte</th><th></th></tr></thead><tbody><tr><td colspan="4" class="tenue">Caricamento…</td></tr></tbody>');
      tab.appendChild(t);
      caricaSessioni(l, t.querySelector('tbody'));
    });
  }

  function caricaSessioni(l, tbody) {
    rest(l.percorso + '/sessioni', { shallow: true }).then(function (s) {
      var codici = Object.keys(s || {}).sort();
      if (!codici.length) { tbody.innerHTML = '<tr><td colspan="4" class="tenue">Nessuna risposta salvata.</td></tr>'; return; }
      tbody.innerHTML = '';
      codici.forEach(function (cod) {
        var tr = el('tr', '', '<td><b>' + esc(etichettaSessione(cod)) + '</b><br><span class="tenue">' + esc(cod) + '</span></td><td class="n">…</td><td class="a">…</td>' +
          '<td class="az"><button class="p csv" type="button">Scarica CSV</button><button class="p canc" type="button">Cancella</button></td>');
        tbody.appendChild(tr);
        Promise.all([rest(l.percorso + '/sessioni/' + cod + '/presenze', { shallow: true }), rest(l.percorso + '/sessioni/' + cod + '/risposte', { shallow: true })])
          .then(function (x) { tr.querySelector('.n').textContent = Object.keys(x[0] || {}).length; tr.querySelector('.a').textContent = Object.keys(x[1] || {}).length; })
          .catch(function () { tr.querySelector('.n').textContent = '?'; tr.querySelector('.a').textContent = '?'; });
        tr.querySelector('.csv').onclick = function () { scaricaCSV(l, cod, this); };
        tr.querySelector('.canc').onclick = function () { chiediConferma(l, cod, tr); };
      });
    }).catch(function (e) {
      tbody.innerHTML = '<tr><td colspan="4"><div class="msg err">' + esc(e.message) + '</div></td></tr>';
    });
  }

  function chiediConferma(l, cod, tr) {
    var td = tr.querySelector('.az'), prima = td.innerHTML;
    td.innerHTML = '<div class="conferma"><span>Per cancellare scrivi <b>' + esc(cod) + '</b></span><input aria-label="codice da cancellare">' +
      '<button class="p pieno ok" type="button">Cancella per sempre</button><button class="p no" type="button">Annulla</button></div>';
    var inp = td.querySelector('input'); inp.focus();
    var ripristina = function () { td.innerHTML = prima; td.querySelector('.csv').onclick = function () { scaricaCSV(l, cod, this); }; td.querySelector('.canc').onclick = function () { chiediConferma(l, cod, tr); }; };
    td.querySelector('.no').onclick = ripristina;
    td.querySelector('.ok').onclick = function () {
      if (inp.value.trim().toUpperCase() !== cod) { inp.style.borderColor = 'var(--rosso)'; inp.focus(); return; }
      this.disabled = true;
      rest(l.percorso + '/sessioni/' + cod, { metodo: 'DELETE' }).then(function () {
        tr.remove(); messaggio('ok', 'Sessione ' + cod + ' di «' + l.titolo + '» cancellata.');
      }).catch(function (e) { ripristina(); messaggio('err', 'Cancellazione non riuscita: ' + e.message); });
    };
  }

  // definizioni delle attività: la lezione, aperta in un iframe con ?v=descrizione, le manda con postMessage
  var descrizioni = {};
  function descrizione(l) {
    if (descrizioni[l.file]) return descrizioni[l.file];
    descrizioni[l.file] = new Promise(function (ok, ko) {
      var f = document.createElement('iframe');
      f.style.display = 'none'; f.src = l.file + '?v=descrizione';
      var fine = setTimeout(function () { window.removeEventListener('message', ascolta); f.remove(); ko(new Error('la lezione non risponde')); }, 15000);
      function ascolta(ev) {
        if (ev.origin !== location.origin || !ev.data || ev.data.tipo !== 'aula-descrizione' || ev.source !== f.contentWindow) return;
        clearTimeout(fine); window.removeEventListener('message', ascolta); f.remove(); ok(ev.data);
      }
      window.addEventListener('message', ascolta);
      document.body.appendChild(f);
    });
    descrizioni[l.file].catch(function () { delete descrizioni[l.file]; });
    return descrizioni[l.file];
  }

  function righeRisposta(a, r) {
    // [voce, risposta]
    var out = [];
    if (a.tipo === 'sondaggio') out.push(['', typeof r === 'number' && a.opzioni ? (a.opzioni[r] != null ? a.opzioni[r] : r) : JSON.stringify(r)]);
    else if (a.tipo === 'breve') out.push(['', r && r.testo != null ? r.testo : JSON.stringify(r)]);
    else if (a.tipo === 'abbinamento') Object.keys(r || {}).forEach(function (k) {
      out.push([a.voci && a.voci[k] ? a.voci[k].testo : 'voce ' + k, a.categorie && a.categorie[r[k]] != null ? a.categorie[r[k]] : r[k]]);
    });
    else if (a.tipo === 'schema' && a.libero) Object.keys(r || {}).forEach(function (k) {
      out.push([a.caselle && a.caselle[k] ? a.caselle[k].titolo : 'casella ' + k, r[k]]);
    });
    else if (a.tipo === 'schema') Object.keys(r || {}).forEach(function (k) {
      out.push([a.termini && a.termini[k] ? a.termini[k].testo : 'termine ' + k, a.caselle && a.caselle[r[k]] ? a.caselle[r[k]].titolo : r[k]]);
    });
    else out.push(['', typeof r === 'object' ? JSON.stringify(r) : r]);
    return out;
  }
  function cellaCSV(v) {
    var s = String(v == null ? '' : v);
    if (/^[=+\-@]/.test(s)) s = "'" + s; // niente formule all'apertura in Excel
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function scaricaCSV(l, cod, bottone) {
    bottone.disabled = true; var testo = bottone.textContent; bottone.textContent = 'Preparo…';
    Promise.all([descrizione(l), rest(l.percorso + '/sessioni/' + cod + '/risposte')]).then(function (x) {
      var desc = x[0], ris = x[1] || {};
      var perId = {}; desc.attivita.forEach(function (a) { perId[a.id] = a; });
      var righe = [['lezione', 'sessione', 'codice_studente', 'passo', 'attivita', 'tipo', 'domanda', 'voce', 'risposta']];
      var ordine = desc.attivita.map(function (a) { return a.id; });
      Object.keys(ris).forEach(function (id) { if (ordine.indexOf(id) < 0) ordine.push(id); });
      ordine.forEach(function (id) {
        var a = perId[id] || { id: id, tipo: '?', domanda: '', passo: '' };
        Object.keys(ris[id] || {}).sort().forEach(function (studente) {
          righeRisposta(a, ris[id][studente]).forEach(function (vr) {
            righe.push([desc.titolo, cod, studente, a.passo, id, a.tipo, a.domanda, vr[0], vr[1]]);
          });
        });
      });
      var csv = '﻿' + righe.map(function (r) { return r.map(cellaCSV).join(';'); }).join('\r\n') + '\r\n';
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = l.file.replace(/\.html$/, '') + '_' + cod + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      messaggio('ok', 'Scaricate ' + (righe.length - 1) + ' righe (' + a.download + ').');
    }).catch(function (e) { messaggio('err', 'Download non riuscito: ' + e.message); })
      .then(function () { bottone.disabled = false; bottone.textContent = testo; });
  }

  if (leggiSS('portale-lezioni:pin') === '1') carica(); else chiediPin();
  window._portale = { annoScolastico: annoScolastico, codiceSessione: codiceSessione };
})();
</script>
</body>
</html>
