<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Famiglia, lavoro, cariche: la differenza di genere nella Costituzione</title>
<meta name="portale:titolo" content="Famiglia, lavoro, cariche pubbliche">
<meta name="portale:materia" content="storia">
<meta name="portale:tipologia" content="lezione">
<meta name="portale:descrizione" content="Lezione interattiva (Storia V): la condizione giuridica delle donne nel 1946, le relazioni delle costituenti sulla famiglia, gli articoli 29, 37 e 51 e le leggi che li hanno attuati, dal 1960 al 2003.">
<meta name="portale:uso" content="lezione">
<meta name="portale:classe" content="quinta">
<link rel="stylesheet" href="../lib/aula.v1.css">
<style>
  /* stili comuni alle quattro lezioni sulla Costituente (slide ricomposte come testo e grafica) */
  .st{font-size:30px;line-height:1.32;min-height:100%;display:flex;flex-direction:column;justify-content:center}
  .st{position:relative;padding-top:30px}
  .st>.occhiello{position:absolute;top:0;left:0;margin:0}
  .att-consegna{padding-right:170px}
  .st .occhiello{font-size:19px;font-weight:700;letter-spacing:1px;color:var(--rosso-scuro);text-transform:uppercase;margin:0 0 14px}
  .st .intro{font-size:32px;line-height:1.36;margin:0 0 22px;max-width:1440px}
  .st .intro b{color:var(--rosso-scuro)}
  .riga-fine{font-family:var(--serif);font-style:italic;font-size:33px;color:var(--rosso-scuro);margin-top:20px;line-height:1.3}
  .nota-piccola{font-size:20px;color:var(--tenue);margin-top:10px;line-height:1.35}
  .credito{font-size:15px;color:var(--tenue);line-height:1.35}
  .domanda-fine{font-family:var(--serif);font-size:50px;line-height:1.25;font-weight:700;margin:40px 0 30px}
  .lettura .brano u{text-decoration-color:var(--rosso);text-decoration-thickness:2px}

  /* blocchi, frecce, linee del tempo */
  .gx{display:flex;align-items:center;gap:14px}
  .gx3{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;margin:6px 0}
  .bx{background:var(--grigio);border-radius:14px;padding:14px 20px;line-height:1.2;text-align:center;flex:1;min-width:0}
  .bx .k{font-size:20px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tenue);margin-bottom:6px}
  .bx .big{display:block;font-size:54px;line-height:1.05;font-weight:700;color:var(--rosso-scuro);font-family:var(--serif)}
  .bx .s{font-size:28px;margin-top:6px;line-height:1.22}
  .bx.rs{background:var(--rosso-scuro);color:#fff}.bx.rs .k,.bx.rs .big{color:#fff}
  .bx.bl{background:var(--blu);color:#fff}.bx.bl .k{color:#CFE0F1}.bx.bl .big{color:#fff}
  .bx.sc{background:#23262D;color:#fff}.bx.sc .k{color:#FFB3B5}.bx.sc .big{color:#fff}
  .bx.ch{background:#FBEDEE}.bx.gl{background:var(--giallo)}.bx.bi{background:#fff;border:2px solid var(--bordo)}
  .bx.az{background:#E6EDF4}.bx.vd{background:var(--verde)}
  .bx.ag{background:#FDF0D5}.bx.ag .big{color:#8A5300}
  .bx small{font-size:.78em;opacity:.85}
  .frw{flex:none;display:flex;align-items:center;justify-content:center}
  .fr{display:block}
  .tl{position:relative;display:grid;gap:16px}
  .tl::before{content:"";position:absolute;left:0;right:0;top:15px;height:6px;background:var(--bordo);border-radius:3px}
  .tn{position:relative;padding-top:44px}
  .tn::before{content:"";position:absolute;left:50%;margin-left:-16px;top:5px;width:26px;height:26px;border-radius:50%;background:var(--rosso);border:3px solid #fff;box-shadow:0 0 0 3px var(--rosso)}
  .tn.ult::before{background:var(--rosso-scuro);box-shadow:0 0 0 3px var(--rosso-scuro)}
  .tn.gr::before{background:#9AA0A6;box-shadow:0 0 0 3px #9AA0A6}
  .tn .dt{text-align:center;font-size:31px;font-weight:700;color:var(--rosso-scuro);line-height:1.1}
  .tn .dt small{display:block;font-size:20px;font-weight:400;color:var(--tenue)}
  .tn .bx{margin-top:10px}
  .tn .bx .s{font-size:24px}
  .dp{display:grid;grid-template-columns:1fr 150px 1fr;gap:12px 14px;align-items:stretch}
  .dp .eti{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:1px;color:var(--tenue);text-align:center}
  .colonna{display:flex;flex-direction:column;gap:10px;min-width:0}
  .gx>*{min-width:0}
  .colonna>.bx{flex:none}
  .titolo-g{font-size:25px;font-weight:700;margin:0 0 10px;text-align:center}

  /* barre orizzontali (risultati, candidature) */
  .bh{display:grid;grid-template-columns:var(--eti,330px) 1fr var(--num,120px);gap:10px 16px;align-items:center;font-size:27px}
  .bh .e{text-align:right;line-height:1.15}
  .bh .b{height:42px;background:#F2F3F5;border-radius:6px;overflow:hidden}
  .bh .b i{display:block;height:100%;border-radius:6px}
  .bh .n{font-weight:700;font-variant-numeric:tabular-nums}
  .bh .n small{font-weight:400;color:var(--tenue)}

  /* emiciclo a quadretti: un quadretto per seggio */
  .quadretti{display:grid;gap:3px}
  .quadretti i{display:block;aspect-ratio:1;border-radius:2px;background:#D5D8DC}
  .seggi{display:flex;height:84px;border-radius:10px;overflow:hidden;margin:10px 0 8px}
  .seggi div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:26px;min-width:0;overflow:hidden;white-space:nowrap}
  .leg{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:22px}
  .leg i{display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:8px;vertical-align:-2px}

  /* articoli della Costituzione */
  .art{background:#FFFDF6;border:2px solid #E2D7B5;border-left:12px solid var(--rosso-scuro);border-radius:10px;padding:16px 22px 14px;font-family:var(--serif);font-size:30px;line-height:1.42}
  .art .n{font-family:var(--sans);font-size:19px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--rosso-scuro);display:block;margin-bottom:6px}
  .art mark{background:#FDE7A8;padding:0 3px;border-radius:3px}
  .art mark.ros{background:#FBD3D5}
  .art .fonte-art{font-family:var(--sans);font-size:16px;color:var(--tenue);margin-top:8px}
  .chip{display:inline-block;background:#fff;border:2px solid var(--blu);color:var(--blu);border-radius:30px;padding:4px 16px;font-size:24px;font-weight:700;margin:4px 6px 4px 0}
  .chip.ros{border-color:var(--rosso-scuro);color:var(--rosso-scuro)}

  /* citazioni brevi sulle slide */
  .cit{font-family:var(--serif);font-size:32px;line-height:1.38;font-style:italic;border-left:8px solid var(--rosso);padding:6px 0 6px 22px;margin:0}
  .cit .fonte{display:block;font-family:var(--sans);font-style:normal;font-size:19px;color:var(--tenue);margin-top:10px;line-height:1.35}

  /* carta */
  .carta-riga{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:start}
  .carta-riga svg{height:650px;width:auto;display:block}
  .legenda-carta{font-size:22px;line-height:1.25;display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
  .legenda-carta p{margin:0 0 6px}
  .legenda-carta .seg{display:inline-block;width:34px;height:22px;vertical-align:-4px;margin-right:10px;border-radius:3px}
  .seg.nv{background:repeating-linear-gradient(45deg,#999 0 3px,#eee 3px 8px)}
  .tabella-dati.media{font-size:25px}
  .tabella-dati.media th,.tabella-dati.media td{padding:8px 14px}
  .tabella-dati tr.aula-f-off>*{border-color:transparent}
  .opzioni-stampa{display:flex;flex-direction:column;gap:12px;margin-top:10px}
  .opzioni-stampa div{background:#F2F3F5;border-radius:10px;padding:12px 20px;font-size:28px}
  .opzioni-stampa div b{color:var(--blu);margin-right:12px}

  /* colore delle lezioni sulla Costituente: banda e titoli in verde (le altre lezioni restano rosse) */
  :root{--banda:#2E6B3F;--banda-scuro:#245632}
  .aula-testata,.disp-testata{background:var(--banda)}
  .st .occhiello,.tn .dt,.riga-fine,.titolo-g{color:var(--banda)}
  .bx .big{color:var(--banda)}
  .bx.rs .big,.bx.bl .big,.bx.sc .big{color:#fff}
  .tn::before{background:var(--banda);box-shadow:0 0 0 3px var(--banda)}
  .tn.ult::before{background:var(--banda-scuro);box-shadow:0 0 0 3px var(--banda-scuro)}
  .tn.gr::before{background:#9AA0A6;box-shadow:0 0 0 3px #9AA0A6}
  .art{border-left-color:var(--banda)}
  .art .n{color:var(--banda)}
  .aula-piede .firma{color:var(--banda)}
</style>
</head>
