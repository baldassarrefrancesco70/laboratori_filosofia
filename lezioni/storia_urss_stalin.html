<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’URSS di Stalin (1922-1938)</title>
<meta name="portale:titolo" content="L'URSS di Stalin (1922-1938)">
<meta name="portale:materia" content="storia">
<meta name="portale:tipologia" content="lezione">
<meta name="portale:descrizione" content="Lezione interattiva (Storia V): la successione di Lenin, rivoluzione permanente e socialismo in un solo paese, la rivoluzione dall'alto, i piani quinquennali e la collettivizzazione, la carestia del 1932-1933, il Grande Terrore e la storia riscritta. Fonti minime, una tabella, due fotografie.">
<meta name="portale:uso" content="lezione">
<meta name="portale:classe" content="quinta">
<link rel="stylesheet" href="../lib/aula.v1.css">
<style>
  /* stili di questa lezione (slide ricomposte come testo) */
  .st{font-size:30px;line-height:1.32}
  .att-consegna{padding-right:170px}
  .st .occhiello{font-size:19px;font-weight:700;letter-spacing:1px;color:var(--rosso-scuro);text-transform:uppercase;margin:0 0 14px}
  .st .intro{font-size:33px;line-height:1.38;margin:0 0 26px;max-width:1440px}
  .st .intro b{color:var(--rosso-scuro)}
  .st .riga-fine{font-family:var(--serif);font-style:italic;font-size:34px;color:var(--rosso-scuro);margin-top:22px}
  .st .nota-piccola{font-size:20px;color:var(--tenue);margin-top:10px}
  .griglia{display:grid;gap:18px}
  .scheda{background:var(--grigio);border-radius:10px;padding:18px 22px;line-height:1.3}
  .scheda h3{margin:0 0 10px;font-size:26px;color:var(--rosso-scuro);text-transform:uppercase;letter-spacing:.5px}
  .scheda.forte{background:#FBEDEE;box-shadow:0 0 0 4px rgba(196,0,0,.35)}
  .scheda.bianca{background:#fff;border:2px solid var(--bordo)}
  .scheda.scura{background:#23262D;color:#fff}.scheda.scura h3{color:#FFB3B5}
  .scheda ul{margin:0;padding-left:22px}.scheda li{margin:0 0 4px}
  .cron{display:grid;grid-template-columns:270px 1fr;gap:0;border-top:2px solid var(--bordo)}
  .cron>div{padding:13px 16px;font-size:29px;border-bottom:2px solid var(--bordo);line-height:1.28}
  .cron .d{font-weight:700;font-variant-numeric:tabular-nums;color:var(--rosso-scuro)}
  .cron .evid{background:var(--giallo)}
  .cron small{display:block;color:var(--tenue);font-size:22px}
  .credito{font-size:15px;color:var(--tenue);line-height:1.35}
  .domanda-fine{font-family:var(--serif);font-size:52px;line-height:1.25;font-weight:700;margin:50px 0 30px}
  .tabella-dati.grande{font-size:29px}
  .tabella-dati.grande th,.tabella-dati.grande td{padding:10px 18px}
  .tabella-dati.media{font-size:25px}
  .tabella-dati.media th,.tabella-dati.media td{padding:8px 14px}
  .tabella-dati td.titr{font-weight:700;color:var(--rosso-scuro);white-space:nowrap}
  .lettura .brano u{text-decoration-color:var(--rosso);text-decoration-thickness:2px}
  .lettura .brano .n{font-family:var(--sans);font-weight:700;color:var(--rosso-scuro);font-size:.8em}
  .carta-riga{display:grid;grid-template-columns:auto 1fr;gap:34px;height:700px;align-items:start}
  .carta-riga svg{height:700px;width:auto;display:block;border:1px solid var(--bordo)}
  .legenda-carta{font-size:25px;line-height:1.3}
  .legenda-carta p{margin:0 0 16px}
  .legenda-carta .seg{display:inline-block;width:34px;height:20px;vertical-align:-2px;margin-right:10px;border-radius:3px}
  .seg.tratt{background:repeating-linear-gradient(45deg,#6E6A64 0 4px,#D9D4CC 4px 9px);border:1px dashed #55514B}
  .seg.rossa{background:rgba(227,20,28,.3);border:2px solid #B00000}
  .seg.nera{background:#2B2B2B;height:7px;vertical-align:5px}
  .seg.blu{background:#1F5FA8;height:7px;vertical-align:5px}
  .foto{display:block;border:1px solid var(--bordo)}
  .due-foto{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .due-foto figure{margin:0}
  .due-foto figcaption{font-size:21px;margin-top:6px;line-height:1.3}
  /* righe di tabella a frammenti: senza bordi finché non compaiono */
  .tabella-dati tr.aula-f-off>*{border-color:transparent}

  /* grafica: blocchi, frecce, linee del tempo, barre */
  .gx{display:flex;align-items:center;gap:14px}
  .gx3{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;margin:6px 0}
  .bx{background:var(--grigio);border-radius:14px;padding:14px 20px;line-height:1.2;text-align:center;flex:1}
  .bx .k{font-size:21px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tenue);margin-bottom:6px}
  .bx .big{display:block;font-size:56px;line-height:1.05;font-weight:700;color:var(--rosso-scuro);font-family:var(--serif)}
  .bx .s{font-size:29px;margin-top:6px;line-height:1.22}
  .bx.rs{background:var(--rosso-scuro);color:#fff}.bx.rs .k,.bx.rs .big{color:#fff}
  .bx.bl{background:var(--blu);color:#fff}.bx.bl .k{color:#CFE0F1}
  .bx.sc{background:#23262D;color:#fff}.bx.sc .k{color:#FFB3B5}.bx.sc .big{color:#fff}
  .bx.ch{background:#FBEDEE}.bx.gl{background:var(--giallo)}.bx.bi{background:#fff;border:2px solid var(--bordo)}
  .bx.az{background:#E6EDF4}
  .frw{flex:none;display:flex;align-items:center;justify-content:center}
  .fr{display:block}
  .tl{position:relative;display:grid;gap:16px}
  .tl::before{content:"";position:absolute;left:0;right:0;top:15px;height:6px;background:var(--bordo);border-radius:3px}
  .tn{position:relative;padding-top:44px}
  .tn::before{content:"";position:absolute;left:50%;margin-left:-16px;top:5px;width:26px;height:26px;border-radius:50%;background:var(--rosso);border:3px solid #fff;box-shadow:0 0 0 3px var(--rosso)}
  .tn.ult::before{background:var(--rosso-scuro);box-shadow:0 0 0 3px var(--rosso-scuro)}
  .tn .dt{text-align:center;font-size:33px;font-weight:700;color:var(--rosso-scuro);line-height:1.1}
  .tn .dt small{display:block;font-size:21px;font-weight:400;color:var(--tenue)}
  .tn .bx{margin-top:10px}
  .dp{display:grid;grid-template-columns:1fr 190px 1fr;gap:12px 14px;align-items:stretch}
  .dp .eti{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:1px;color:var(--tenue);text-align:center}
  .dp .bx{font-size:30px;display:flex;align-items:center;justify-content:center}
  .cc{display:grid;grid-template-columns:1fr 84px 1fr;gap:12px 6px;align-items:stretch}
  .cc .bx{font-size:31px;display:flex;align-items:center;justify-content:center}
  .rw{display:grid;grid-template-columns:150px 1fr 76px 1fr;gap:12px 6px;align-items:stretch}
  .rw .d{display:flex;align-items:center;font-weight:700;font-size:30px;color:var(--rosso-scuro)}
  .rw .bx{font-size:27px;display:flex;align-items:center;justify-content:center}
  .istog{display:flex;align-items:flex-end;gap:22px;height:320px;border-bottom:4px solid #23262D;padding:0 14px}
  .istog .cl{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .istog .cl i{display:block;width:100%;border-radius:6px 6px 0 0}
  .istog .cl b{font-size:30px;margin-bottom:4px}
  .asse-g{display:flex;gap:22px;padding:6px 14px;font-size:24px;color:var(--tenue)}.asse-g span{flex:1;text-align:center}
  .bx small{font-size:.78em;opacity:.85}
  .titolo-g{font-size:26px;font-weight:700;margin:0 0 10px;text-align:center}
  .seggi{display:flex;height:96px;border-radius:10px;overflow:hidden;margin:10px 0 8px}
  .seggi div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:30px}
  .leg{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:22px}
  .leg i{display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:8px;vertical-align:-2px}
</style>
</head>

      note: '<p>Clic 1: la riga «Inoltre». Per il manuale il socialismo in un solo paese rompe, almeno in parte, con l’internazionalismo marxista, ma ha un consenso enorme: è realistico dopo il fallimento delle rivoluzioni in Europa e offre un richiamo patriottico.</p>' },

    { titolo: 'Di chi è questa frase?', html: S_ABB, minuti: 3.5, attivita: CHI_LO_DICE,
      note: '<p><b>Abbinamento</b> (2 min e mezzo). Le fonti compaiono solo nella ripresa.</p><p><b>Ripresa</b>: autori e date in chiaro. <b>Punta il commento</b> sul criterio: dove sta il socialismo, nel mondo o «nel nostro paese»? Poi sulla frase del 1925, che di solito inganna: l’industrializzazione rapida era stata la bandiera dell’opposizione di sinistra (Trockij), e Stalin la fa sua dopo averla sconfitta. La seconda frase di Trockij è del 1906: la tesi viene da lontano.</p><p><b>Traduzioni di lavoro mie dal russo, non collazionate</b>; le frasi di Trockij (tesi fondamentali de <i>La rivoluzione permanente</i>; <i>Bilanci e prospettive</i>, cap. IX) e di Stalin (<i>Questioni del leninismo</i>, cap. VI; rapporto al XIV congresso) vanno verificate su un’edizione prima dell’uso.</p>' },

    { titolo: 'La lotta per la successione', html: S_SUCCESSIONE, minuti: 3,
      note: '<p>Il paragrafo più difficile da ordinare: alleanze che si fanno e si rompono. Clic 1-3, clic 4 la riga finale. Bucharin sarà condannato nel 1930 come «deviazionista di destra».</p>' },

    { titolo: 'La rivoluzione dall’alto', html: S_SVOLTA, minuti: 1,
      note: '<p>Due fronti: campagne e città. La formula sui kulaki è del discorso di Stalin alla conferenza degli agronomi marxisti, 27 dicembre 1929.</p>' },

    { titolo: 'Stalin, febbraio 1931', html: lettura(STALIN31), dispositivo: STALIN31, minuti: 1.5,
      note: '<p><b>Lettura</b> (circa 40 parole), anche sui telefoni. Chiedi a voce: quale argomento usa per giustificare i ritmi? La minaccia esterna. Dieci anni dopo il discorso è il 1941.</p><p><b>Traduzione di lavoro mia dal russo, non collazionata.</b></p>' },

    { titolo: 'I piani quinquennali e le campagne', html: S_TABELLA, minuti: 1.5,
      note: '<p>Lascia leggere la tabella in silenzio per mezzo minuto: è anche sui telefoni nel passo successivo.</p><p><b>Cifre</b>: per l’industria sono i dati ufficiali del Gosplan (carbone 35,4 → 65,4 → 127,9; acciaio 4,0 → 5,9 → 17,7; elettricità 5,0 → 13,0 → 36,4). Per il bestiame sono le serie dei censimenti sovietici riprese da Nove. Le ho controllate su più compilazioni di seconda mano, non su Nove. Le serie del bestiame variano di qualche milione da una fonte all’altra (per esempio 68 milioni di bovini nel 1929), ma il crollo è lo stesso. Le cifre ufficiali dell’industria sono gonfiate; la crescita resta comunque reale.</p>' },

    { titolo: 'Che cosa dice la tabella?', html: S_TABELLA_ATT, minuti: 3,
      attivita: { id: 'piani', tipo: 'sondaggio', minuti: 1.5,
        domanda: 'Che cosa dice la tabella?',
        opzioni: ['Negli stessi anni l’industria cresce e l’allevamento crolla', 'La crescita industriale è stata pagata dalle campagne', 'Il primo piano quinquennale è fallito', 'Nel 1937 i sovietici vivono meglio che nel 1928'],
        testo: PIANI_DISP, testoAperto: true },
      note: '<p><b>Sondaggio sulla tabella</b> (90 secondi). Le tabelle sono anche sui telefoni, aperte sopra la domanda.</p><p><b>Ripresa</b>: la prima risposta è quella che la tabella sostiene. <b>Punta il commento</b> sulla seconda, che è la lettura del manuale («sviluppo contraddittorio»): plausibile, ma la tabella da sola mostra la contemporaneità, non il legame causale. Per sostenerlo servono altri fatti, come il grano requisito ed esportato per comprare macchinari (passo 13). La terza è smentita dal carbone quasi raddoppiato. La quarta riguarda i consumi, di cui la tabella non dice nulla, e il manuale dice il contrario.</p>' },

    { titolo: 'La collettivizzazione', html: S_COLLETTIVIZZAZIONE, minuti: 2,
      note: '<p>Clic 1-2. La meccanizzazione non aumentò subito i raccolti. Il terzo riquadro riprende la riga dei bovini della tabella.</p>' },

    { titolo: 'La carestia del 1932-1933', html: S_CARESTIA, minuti: 3,
      note: '<p>Nessuna attività, di proposito: qui guidi tu. Clic 1: l’Holodomor; clic 2: il nodo storiografico. Sulla slide non c’è la frase di Stalin a Kaganovič dell’11 agosto 1932, che puoi dire a voce (traduzione di lavoro): «La cosa più importante adesso è l’Ucraina». Il parlamento ucraino ha riconosciuto la carestia come genocidio: una qualificazione ancora discussa. Per il manuale fu la scelta politica di non intervenire a trasformare la carestia in una catastrofe di massa. La lettura che oggi prevale vede l’uso politico della carestia. Resta discusso se si possa parlare di genocidio, che richiede di dimostrare l’intenzione di eliminare gli ucraini in quanto tali.</p><p>La frase della lettera è nella Sintesi come «la questione principale»; qui la rendo dal russo (<i>samoe glavnoe</i>, «la cosa più importante»), in traduzione di lavoro non collazionata. Lettera del 11 agosto 1932.</p><p>Attenzione in classe a studenti con legami familiari con l’Ucraina.</p>' },

    { titolo: 'Nelle fabbriche', html: S_OPERAI, minuti: 1,
      note: '<p>Stachanov: 31 agosto 1935, 102 tonnellate di carbone in meno di sei ore, secondo la stampa sovietica (l’impresa fu preparata). Nel tuo schema c’è «URSS terza potenza mondiale»; la Sintesi dice «seconda potenza industriale per volume»: seguo la Sintesi.</p>' },

    { titolo: 'Lo Stato totalitario sovietico', html: S_STRUMENTI, minuti: 2,
      note: '<p>In alto ciò che comanda e convince; clic 1: ciò che reprime. Gli strumenti si sostengono a vicenda: il partito li dirige, la polizia li alimenta, i gulag li rendono produttivi, il culto e la cultura li giustificano. Solženicyn chiamò il sistema dei campi «arcipelago»; per Hannah Arendt il campo è il laboratorio del dominio totalitario. Da dire a voce, senza citazioni sulla slide.</p>' },

    { titolo: 'Il Grande Terrore', html: S_TERRORE, minuti: 2.5,
      note: '<p>Clic 1-3. Per il manuale le vittime più illustri del terrore non furono i nemici della rivoluzione, ma i suoi artefici. Kirov fu con ogni probabilità eliminato per ordine di Stalin: è un giudizio probabile, non un fatto accertato.</p><p><b>Cifre</b>: 1.575.259 arresti e 681.692 condanne a morte eseguite nel 1937-1938 secondo i registri dell’NKVD. Sono le cifre più citate (Getty, Rittersporn, Zemskov 1993; Memorial), arrotondate sulla slide. Le ho controllate su fonti di seconda mano. Non comprendono i morti nei gulag.</p>' },

    { titolo: 'Chi manca nella foto?', html: S_FOTO_ATT, minuti: 3,
      attivita: { id: 'foto', tipo: 'punto', minuti: 1.5, rapporto: 1.496,
        domanda: 'Nella foto pubblicata dopo il 1940 manca una persona. Tocca il punto in cui stava.',
        immagine: '<img src="' + EZOV_CENS + '" alt="La fotografia ritoccata: tre uomini sul canale">',
        testo: EZOV_DISP, testoAperto: true,
        zone: [{ x: 600, y: 470, r: 130, etichetta: 'Nikolaj Ežov, capo dell’NKVD', sopra: true }] },
      note: '<p><b>Punto sulla foto</b> (90 secondi). Sui telefoni la foto originale è aperta sopra quella ritoccata. Ogni telefono mette un solo punto e lo può spostare.</p><p><b>Ripresa</b>: compare in verde il posto di Ežov. <b>Punta il commento</b> su chi è: il capo della polizia politica negli anni del Grande Terrore (1936-1938), l’esecutore delle purghe, arrestato nel 1939 e fucilato nel 1940. Il terrore colpisce anche chi lo ha amministrato, e la foto viene corretta di conseguenza. Il passo successivo mostra che non è un caso isolato.</p><p><b>Fotografie</b>: le copie sono quelle che mi hai passato, di provenienza non indicata. Su Wikimedia Commons le stesse foto sono catalogate come di pubblico dominio: controlla la scheda di Commons se vuoi citare il file preciso.</p>' },

    { titolo: 'La storia riscritta', html: S_RISCRITTA, minuti: 1,
      note: '<p>Clic 1-3 i tre destini, clic 4 la riga finale. Il cerchio rosso intorno a Trockij non è nell’originale: l’ho lasciato perché sta nella copia che mi hai passato, e lo dice la didascalia. Nella foto del 1920 Kamenev è sui gradini, sotto Trockij.</p><p>Aggancio al controllo della cultura (passo 15): archivi, manuali e fotografie riscritti.</p>' },

    { titolo: 'Sviluppo o tradimento?', html: S_DOMANDA_FINE, minuti: 3.5,
      attivita: { id: 'stalinismo', tipo: 'sondaggio', minuti: 1.5,
        domanda: 'Lo stalinismo, rispetto alla rivoluzione di Lenin, è…',
        opzioni: ['Uno sviluppo coerente: gli strumenti del terrore c’erano già', 'Un tradimento: con Lenin il partito discuteva ancora', 'La ripresa della tradizione autocratica zarista', 'Una via dispotica per modernizzare in fretta un paese arretrato'] },
      note: '<p><b>Sondaggio</b> (90 secondi), senza risposta giusta: sono le quattro letture del nodo storiografico.</p><p><b>Ripresa</b>: le barre. <b>Punta il commento</b> sulle prime due, con i fatti delle due lezioni. Per la continuità: la Čeka (dicembre 1917), le opposizioni fuori legge e la pena di morte (giugno 1918), il terrore rosso, la Costituente sciolta, Kronstadt. Per la rottura, sostenuta da Trockij che parlava di «reazione termidoriana»: con Lenin il partito discuteva ancora al suo interno, e il terrore degli anni Trenta colpisce il partito stesso. Chiedi a chi ha scelto la terza e la quarta su quale fatto si appoggiano. Il nodo torna nella Palestra di argomentazione.</p>' },

    { titolo: TITOLO, html: S_CHIUSURA, minuti: 0.5,
      note: '<p>La risposta alla domanda iniziale, in tre parole: apparato, paura, storia riscritta. Clic 1: l’aggancio al confronto con fascismo e nazismo.</p>' }
  ];

  Aula.avvia({
