<style>
  /* stili di questa lezione (slide ricomposte come testo) */
  .st{font-size:30px;line-height:1.32}
  .att-consegna{padding-right:170px}
  .st .occhiello{font-size:19px;font-weight:700;letter-spacing:1px;color:var(--rosso-scuro);text-transform:uppercase;margin:0 0 14px}
  .st .intro{font-size:33px;line-height:1.38;margin:0 0 26px;max-width:1440px}
  .st .intro b{color:var(--rosso-scuro)}
  .st .riga-fine{font-family:var(--serif);font-style:italic;font-size:35px;color:var(--rosso-scuro);margin-top:22px}
  .st .nota-piccola{font-size:20px;color:var(--tenue);margin-top:10px}
  .griglia{display:grid;gap:18px}
  .scheda{background:var(--grigio);border-radius:10px;padding:18px 22px;line-height:1.3}
  .scheda h3{margin:0 0 10px;font-size:27px;color:var(--rosso-scuro);text-transform:uppercase;letter-spacing:.5px}
  .scheda.forte{background:#FBEDEE;box-shadow:0 0 0 4px rgba(196,0,0,.35)}
  .scheda.bianca{background:#fff;border:2px solid var(--bordo)}
  .scheda.scura{background:#23262D;color:#fff}.scheda.scura h3{color:#FFB3B5}
  .scheda ul{margin:0;padding-left:22px}.scheda li{margin:0 0 4px}
  .potenza h3{background:var(--rosso-scuro);color:#fff;margin:-16px -20px 12px;padding:10px 16px;border-radius:10px 10px 0 0;font-size:24px}
  .cron{display:grid;grid-template-columns:230px 1fr;gap:0;border-top:2px solid var(--bordo)}
  .cron>div{padding:16px 16px;font-size:32px;border-bottom:2px solid var(--bordo)}
  .cron .d{font-weight:700;font-variant-numeric:tabular-nums;color:var(--rosso-scuro)}
  .cron .evid{background:var(--giallo)}
  .cron small{display:block;color:var(--tenue);font-size:23px}
  .catena{display:grid;grid-template-columns:1fr 70px 1fr;gap:16px;align-items:center}
  .catena .num{display:inline-block;width:36px;height:36px;border-radius:50%;background:var(--rosso-scuro);color:#fff;text-align:center;font-weight:700;line-height:36px;margin-right:10px;font-size:22px}
  .freccia-dx{font-size:60px;color:var(--rosso-scuro);text-align:center}
  .anello{margin-top:18px;border:3px dashed var(--rosso-scuro);border-radius:10px;padding:14px 20px;background:#fff}
  .anello h3{margin:0 0 6px;font-size:24px;color:var(--rosso-scuro);text-transform:uppercase}
  .carta-fig{display:block;height:100%;width:auto;border:1px solid var(--bordo)}
  .credito{font-size:15px;color:var(--tenue);line-height:1.35}
  .due-fonti{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .due-fonti .fonte-breve{font-family:var(--serif);font-size:21px;line-height:1.42;background:#fff;border-left:5px solid var(--rosso-scuro);padding:6px 14px}
  .due-fonti .fonte-breve .rif{display:block;font-family:var(--sans);font-size:15px;color:var(--tenue);margin-top:6px}
  .domanda-fine{font-family:var(--serif);font-size:52px;line-height:1.25;font-weight:700;margin:60px 0 30px}
  .tabella-dati.grande{font-size:31px}
  .tabella-dati.grande th,.tabella-dati.grande td{padding:11px 20px}
  /* gettoni dello schema a corpo fisso: con una classe intera le frasi devono stare nelle caselle */
  .schema .gettone{font-size:19px!important}
  .lettura .brano u{text-decoration-color:var(--rosso);text-decoration-thickness:2px}
</style>

          { testo: '«Il commercio, che ha arricchito i cittadini in Inghilterra, ha contribuito a renderli liberi, e questa libertà ha esteso a sua volta il commercio.»', fonte: 'Voltaire, Lettere filosofiche, X, 1734', atteso: 0 },
          { testo: '«Le nostre anime si sono corrotte a mano a mano che le nostre scienze e le nostre arti sono avanzate verso la perfezione.»', fonte: 'Rousseau, Discorso sulle scienze e sulle arti, 1750, parte I', atteso: 1 },
          { testo: '«Ringrazio la natura saggia che, per il mio bene, mi ha fatto nascere in quest’età tanto denigrata dai nostri tristi censori. […] Il paradiso terrestre è dove sono io.»', fonte: 'Voltaire, Il mondano, 1736, vv. 1-3 e ultimo verso', atteso: 0 },
          { testo: '«Il primo che, recintato un terreno, pensò di dire “questo è mio” e trovò persone abbastanza ingenue da credergli, fu il vero fondatore della società civile.»', fonte: 'Rousseau, Discorso sull’origine della disuguaglianza, 1755, inizio della parte II', atteso: 1 }
        ] },
      note: '<p><b>Abbinamento</b> (2 min). Le fonti compaiono solo nella ripresa.</p><p><b>Ripresa</b>: autori e opere in chiaro. <b>Punta il commento</b> sul criterio: non serve sapere chi ha scritto che cosa, basta leggere che cosa pensa la frase della civiltà e del commercio. Poi passi alla slide successiva, che generalizza: al posto di «gli illuministi», un nome. Se c’è tempo: nel 1760 Rousseau scrive a Voltaire «non vi amo, signore» (lettera del 17 giugno).</p><p><b>Traduzioni di lavoro mie dal francese, non collazionate.</b></p>' },

    { titolo: '«Gli illuministi pensavano che…»', html: S_DIVISI, minuti: 1,
      note: '<p>Viene dopo l’abbinamento: la riga sulla società è l’esercizio appena fatto. Leggi la prima riga, poi le altre tre, e fissa la regola: al posto di «gli illuministi», un nome.</p>' },

    { titolo: 'Che cosa i governi provano a fare', html: S_RIFORME, minuti: 1.5,
      note: '<p>Il primo capoverso è la correzione anti-agiografica: le riforme nascono dalla pressione fiscale e militare, non da un’illuminazione morale dei sovrani. Tanucci e Pietro Leopoldo solo menzionati: la trattazione va nel Percorso 4.</p>' },

    { titolo: 'Contro che cosa sbattono le riforme', html: S_OSTACOLI, minuti: 1.5,
      note: '<p>Clic 1: il secondo riquadro. L’ostacolo è strutturale, non morale. Il passo successivo lo fa dire a chi difende i privilegi.</p>' },

    { titolo: 'Il privilegio come diritto: Parigi, 1776', html: lettura(RIMOSTRANZE), dispositivo: RIMOSTRANZE, minuti: 1,
      note: '<p><b>Lettura</b> (circa 90 parole), anche sui telefoni. È il Parlamento contro gli editti di Turgot: il privilegio non è difeso come utile, ma come <i>proprietà</i>, al pari dei beni. <b>Punta</b> sulle due sottolineature e sull’ultima frase: a ciascun ordine il suo modo di servire lo Stato.</p><p><b>Traduzione di lavoro mia dal francese, non collazionata</b> con Flammermont: data esatta (tra il 2 e il 4 marzo 1776) e pagine da verificare sul volume III.</p>' },

    { titolo: 'Perché in Francia la strada si chiude', html: S_FRANCIA, minuti: 1,
      note: '<p>La cerniera fra la Fase 0 e il resto del percorso. Clic 1: l’ultima riga. La convocazione degli Stati generali non è un atto riformatore ma l’ammissione che la macchina fiscale è bloccata. Alimenta la scheda 5 (controfattuale su Luigi XVI).</p>' },

    { titolo: 'Il bilancio del 1788', html: S_BILANCIO, minuti: 1,
      note: '<p>Lascia leggere la tabella in silenzio per mezzo minuto: è anche sui telefoni nel passo successivo.</p><p><b>Cifre</b>: ricostruzione di Braesch del bilancio 1788 (Compte rendu au roi di Brienne), arrotondate; le percentuali corrispondenti sono debito 50,5%, esercito e marina 26,3%, corte 5,7%, come in J.-P. Jessenne, <i>Révolution et Empire</i>, Hachette 1993. Le ho controllate su due fonti di seconda mano, non sul Braesch.</p><p><b>Attenzione alla Sintesi</b>: il debito vale circa metà delle <i>spese</i>, cioè più di sei decimi delle <i>entrate</i> (318 su 503), non «metà delle entrate».</p>' },

    { titolo: 'Che cosa dice la tabella?', minuti: 2.5,
      html: '<p class="att-consegna">Sul telefono: che cosa dice la tabella sul blocco della monarchia?</p>' +
        '<p style="font-size:22px;color:var(--tenue);margin:0">Debito 318 · Esercito, marina, diplomazia 165 · Corte 36 · Altro 110 · Spese 629 · Entrate 503 (milioni)</p>',
      attivita: { id: 'bilancio', tipo: 'sondaggio', minuti: 1.5,
        domanda: 'Che cosa dice la tabella sul blocco della monarchia?',
        opzioni: ['La corte di Versailles spende troppo', 'Le guerre si pagano due volte: con l’esercito di oggi e con il debito di ieri', 'La Francia è un paese povero e il re incassa poco', 'L’amministrazione dello Stato costa troppo'],
        testo: BILANCIO_DISP, testoAperto: true },
      note: '<p><b>Sondaggio sulla tabella</b> (90 secondi).</p><p><b>Ripresa</b>: la seconda risposta è quella che la tabella sostiene. Il debito è fatto in gran parte delle guerre passate, ultima quella americana (slide precedente), e si somma alle spese militari correnti: insieme fanno circa tre quarti delle spese. <b>Punta il commento</b> sulle due risposte sbagliate più interessanti: la corte (il luogo comune, meno di un ventesimo) e la «Francia povera». La tabella non dice nulla sulla ricchezza del paese: dice che il re non riesce a prelevarla, perché i privilegi fiscali sono diritti (passo delle Rimostranze).</p>' },

    { titolo: 'Due parole che stanno per cambiare significato', html: S_PAROLE, minuti: 1.5,
      note: '<p>Aggancio alla sestina delle parole del quadro d’anno. Clic 1: «entro pochi anni» e «presto». Vanno richiamate ogni volta che ricompaiono.</p>' },

    { titolo: 'Stessa parola, titolare diverso', html: S_NAZIONE_ATT, minuti: 3,
      attivita: { id: 'nazione', tipo: 'breve', minuti: 2, max: 140,
        domanda: 'Nel 1766 e nel 1789 compare la stessa parola, «nazione». Che cosa cambia?',
        segnaposto: 'Una frase',
        testo: DUE_FONTI_DISP, testoAperto: true },
      note: '<p><b>Risposta breve</b> (2 min). Le due fonti sono sulla slide e sui telefoni.</p><p><b>Ripresa</b>: dal muro evidenzia (clic) le risposte che colgono il cambio di titolare: nel 1766 la nazione «riposa» nelle mani del re e non può essere un corpo separato; nel 1789 è la nazione il principio della sovranità, e nessun corpo né individuo, re compreso, ha autorità che non venga da lei. <b>Punta</b> sul fatto che il re usa già la parola: la combatte perché i parlamenti la usano contro di lui.</p><p>Il 1789 è un’anticipazione: dillo come approdo del percorso, non come esito già scritto nel 1766.</p><p><b>Traduzioni di lavoro mie dal francese, non collazionate.</b></p>' },

    { titolo: TITOLO, html: S_CHIUSURA, minuti: 0.5,
      note: '<p>Chiusura che apre: da leggere insieme alla seconda slide. Clic 1: le due righe finali. Il cambiamento è avvenuto senza essere previsto, non «stava per arrivare».</p>' }
  ];
