  var TESI = '<span class="etichetta autore">Lenin</span> ' + TRAD +
    '<div class="brano">' +
    '<p><span class="n">1.</span> Nel nostro atteggiamento verso la guerra ' + MIO + ' non è ammissibile la minima concessione al «difensismo rivoluzionario».</p>' +
    '<p><span class="n">3.</span> <u>Nessun appoggio al governo provvisorio</u>; spiegare la completa falsità di tutte le sue promesse, in particolare di quella di rinunciare alle annessioni.</p>' +
    '<p><span class="n">5.</span> Non una repubblica parlamentare (tornarvi dai soviet dei deputati operai sarebbe un passo indietro), ma <u>una repubblica dei soviet</u> dei deputati operai, braccianti e contadini in tutto il paese, dal basso in alto.</p>' +
    '<p><span class="n">6.</span> ' + MIO + ' Confisca di tutte le terre dei grandi proprietari. Nazionalizzazione di tutte le terre del paese ' + MIO + '.</p>' +
    '<p><span class="n">8.</span> Non l’«introduzione» del socialismo come nostro compito immediato, ma soltanto il passaggio immediato al controllo dei soviet dei deputati operai sulla produzione sociale e sulla distribuzione dei prodotti.</p></div>' +
    '<div class="fonte"><b>V.I. Lenin, <i>Sui compiti del proletariato nella rivoluzione attuale</i></b> (le «Tesi di aprile»), «Pravda», n. 26, 7 (20) aprile 1917. Tesi 1, 3, 5, 6, 8. Traduzione di lavoro dal russo. ' + MIO + ' = taglio per la lezione. Sottolineature per la lezione.</div>';

  var DECRETI = '<span class="etichetta autore">II Congresso dei soviet</span> ' + TRAD +
    '<div class="brano">' +
    '<p><b>Decreto sulla pace.</b> Il governo operaio e contadino, creato dalla rivoluzione del 24-25 ottobre e fondato sui soviet dei deputati operai, soldati e contadini, propone a tutti i popoli belligeranti e ai loro governi di avviare subito trattative per una pace giusta e democratica ' + MIO + ': una pace immediata senza annessioni ' + MIO + ' e senza indennità.</p>' +
    '<p><b>Decreto sulla terra.</b> 1. La grande proprietà fondiaria è abolita immediatamente, senza alcun indennizzo.<br>2. Le tenute dei grandi proprietari, come pure tutte le terre della Corona, dei monasteri e delle chiese, con il bestiame e gli attrezzi ' + MIO + ', passano a disposizione dei comitati agrari di distretto e dei soviet dei deputati contadini, <u>fino all’Assemblea costituente</u>.</p></div>' +
    '<div class="fonte"><b>Decreti approvati dal II Congresso panrusso dei soviet</b>, 26 ottobre (8 novembre) 1917: decreto sulla pace, inizio; decreto sulla terra, artt. 1-2. Traduzione di lavoro dal russo. ' + MIO + ' = taglio per la lezione. Sottolineatura per la lezione.</div>';

  var KRONSTADT = '<span class="etichetta autore">Marinai di Kronstadt</span> ' + TRAD +
    '<div class="brano">' +
    '<p><span class="n">1.</span> Poiché i soviet attuali non esprimono la volontà degli operai e dei contadini, <u>rieleggere subito i soviet a scrutinio segreto</u>, con libera propaganda preliminare fra tutti gli operai e i contadini.</p>' +
    '<p><span class="n">2.</span> Libertà di parola e di stampa per gli operai e i contadini, per gli anarchici e per i partiti socialisti di sinistra.</p>' +
    '<p><span class="n">8.</span> Togliere tutti i reparti di sbarramento.</p>' +
    '<p><span class="n">11.</span> Dare ai contadini pieno diritto di disporre di tutta la terra come desiderano, e di tenere bestiame, purché lo curino con le proprie forze, cioè senza lavoro salariato.</p></div>' +
    '<div class="fonte"><b>Risoluzione degli equipaggi delle corazzate <i>Petropavlovsk</i> e <i>Sevastopol’</i></b>, 28 febbraio 1921, approvata dall’assemblea di Kronstadt il 1° marzo; in «Izvestija» del Comitato rivoluzionario provvisorio di Kronstadt, n. 1, 3 marzo 1921. Punti 1, 2, 8, 11. Traduzione di lavoro dal russo. Sottolineatura per la lezione.</div>';

  var passi = [
    { tipo: 'copertina', titolo: TITOLO,
      note: '<p>Lascia il QR sullo schermo mentre la classe entra. Q lo riapre in qualsiasi momento.</p><p>Il portale apre la lezione già con il codice della classe (es. 5A2627): con lo stesso codice si riprende da un altro computer. G apre l’elenco dei passi.</p>' },

      note: '<p><b>Sondaggio d’ingresso</b> (1 min). È la domanda storiografica della lezione: falla votare senza spiegare nulla.</p><p><b>Ripresa</b>: mostra le barre ma <b>non commentarle</b>. Di’ solo che la domanda torna dopo la Costituente (passo 11), dove il sondaggio mostrerà il prima e il dopo.</p>' },

    { titolo: 'La Russia nel 1917', html: S_1917, minuti: 1.5,
      note: '<p>Tre anni di guerra hanno consumato i margini del regime. Il Settecento e l’Ottocento della classe: un’autocrazia senza corpi intermedi, quindi senza nessuno che la sostenga quando cede l’esercito.</p><p>Le cifre delle perdite non sono sulla slide: se le vuoi dare, controllale prima, perché le stime variano molto.</p>' },

    { titolo: 'Febbraio 1917: cade lo zar', html: S_FEBBRAIO, minuti: 2,
      note: '<p>Insisti su <b>spontanea</b> e su <b>fraternizzano</b>: servono all’abbinamento del passo 9. Clic 1: la nota sui due calendari.</p><p>Il 23 febbraio giuliano è l’8 marzo gregoriano, Giornata internazionale della donna: è la data che compare nel tuo schema («8 marzo 1917»). Le date di questa slide sono quelle comunemente accettate; il manuale non le dà giorno per giorno.</p>' },

    { titolo: 'Il doppio potere', html: S_DOPPIO, minuti: 2.5,
      note: '<p>Righe a frammenti (clic 1-3), clic 4 la riga finale. Il punto è la riga «Guerra»: il governo provvisorio resta in guerra, ed è lì che perde consenso.</p><p>Nel tuo schema la Duma sta dal lato dei liberali: il governo provvisorio nasce dal comitato della Duma.</p>' },

    { titolo: 'Lenin, aprile 1917', html: lettura(TESI), dispositivo: TESI, minuti: 2,
      note: '<p><b>Lettura</b> (circa 130 parole), anche sui telefoni. Lenin rientra dalla Svizzera con un viaggio favorito dalle autorità tedesche.</p><p><b>Punta</b> sulle due sottolineature: niente appoggio al governo provvisorio, repubblica dei soviet al posto di quella parlamentare. È la rottura con l’ortodossia dei socialisti russi, che attendevano una lunga fase borghese. La formula «tutto il potere ai soviet» non è nel testo delle tesi: è la parola d’ordine che le riassume.</p><p><b>Traduzione di lavoro mia dal russo, non collazionata</b> con un’edizione italiana (Opere complete, vol. 24).</p>' },

    { titolo: 'Da luglio a ottobre', html: S_LUGLIO, minuti: 3,
      note: '<p>Clic 1-3. Su Kornilov: un golpe che avrebbe dovuto colpire anche i bolscevichi finisce per rafforzarli più di chiunque altro.</p><p>Kornilov: fine agosto giuliano, inizio settembre gregoriano. La Sintesi lo data «settembre».</p>' },

    { titolo: 'I primi decreti', html: lettura(DECRETI), dispositivo: DECRETI, minuti: 1.5,
      note: '<p><b>Lettura</b> (circa 120 parole), anche sui telefoni. Pace e terra: le due domande che il governo provvisorio non aveva soddisfatto.</p><p><b>Punta</b> sulla sottolineatura: «fino all’Assemblea costituente». Il decreto stesso rimanda a un’assemblea elettiva: è la cerniera con il passo 10.</p><p><b>Traduzione di lavoro mia dal russo, non collazionata.</b></p>' },

    { titolo: 'Febbraio o Ottobre?', html: S_ABB, minuti: 3.5, attivita: FEB_OTT,
      note: '<p><b>Abbinamento</b> (2 min e mezzo). Le due rivoluzioni si confondono facilmente: questo è il controllo.</p><p><b>Ripresa</b>: in proiezione la collocazione attesa. <b>Punta il commento</b> sulla voce che divide di più. Di solito è il doppio potere (nasce da febbraio, non da ottobre: ottobre lo chiude) oppure l’insurrezione «spontanea» contro quella «diretta». Chiudi con lo schema: febbraio abbatte l’autocrazia, ottobre abbatte il governo nato da febbraio.</p>' },

    { titolo: 'L’Assemblea costituente', html: S_COSTITUENTE_ATT, minuti: 3.5,
      attivita: { id: 'costituente', tipo: 'sondaggio', minuti: 1.5, saltabile: true,
        domanda: 'Che cosa dice la tabella?',
        opzioni: ['I bolscevichi sono una minoranza nell’assemblea eletta', 'I bolscevichi non hanno alcun consenso popolare', 'Con i socialrivoluzionari di sinistra, i bolscevichi hanno la maggioranza', 'La tabella dimostra che l’Ottobre fu un colpo di Stato'],
        testo: COSTITUENTE_DISP, testoAperto: true },
      note: '<p><b>Sondaggio sulla tabella</b> (90 secondi), saltabile con S. La tabella è anche sui telefoni, aperta sopra la domanda.</p><p><b>Ripresa</b>: la prima risposta è quella che la tabella sostiene. Bolscevichi e socialrivoluzionari di sinistra insieme fanno 215 seggi su 707: la terza è sbagliata di conto. <b>Punta il commento</b> sulle due che dicono troppo: la tabella non dice che i bolscevichi non hanno consenso (un quarto dei voti, e la maggioranza nelle città e fra i soldati del fronte occidentale), né decide da sola fra rivoluzione e colpo di Stato. Dice chi era in minoranza nel novembre 1917 e che cosa il governo fece della minoranza: la usa il passo successivo.</p><p><b>Cifre</b>: seggi dalla memoria di Woytinsky (1961), che registra i deputati presenti all’apertura. Altre ricostruzioni, su 767 seggi complessivi, danno ai socialrivoluzionari più di 400 seggi (come la Sintesi, che somma socialrivoluzionari russi e ucraini) e ai bolscevichi tra 168 e 183. La quota di voti bolscevica (circa il 24%) viene dalle stime di O. Radkey. Ho controllato le cifre su due fonti di seconda mano, non sui volumi.</p>' },

    { titolo: 'Rivoluzione o colpo di Stato? Di nuovo', html: S_DOMANDA2, minuti: 2,
      attivita: { id: 'ottobre_dopo', tipo: 'sondaggio', minuti: 1, domanda: 'Ottobre 1917: rivoluzione o colpo di Stato?', opzioni: OPZ_OTTOBRE,
        confronta: 'ottobre_prima', etichette: ['All’inizio', 'Adesso'] },
      note: '<p><b>Sondaggio di uscita</b> (1 min), con il confronto con il passo 2.</p><p><b>Ripresa</b>: il confronto prima/dopo. <b>Punta il commento</b> su chi si è spostato e perché: di solito verso «tutte e due le cose» dopo la tabella. Non chiudere la questione qui: il passo successivo dà le due letture degli storici.</p>' },

    { titolo: 'Due letture', html: S_DUE_LETTURE, minuti: 1,
      note: '<p>Le due posizioni storiografiche, poi (clic 1) la proposta del manuale in azzurro: la presenti tu a voce, come raccordo, non come parola definitiva. Il nodo torna nella Palestra di argomentazione della sezione.</p>' },

    { titolo: 'Brest-Litovsk, marzo 1918', html: S_BREST, minuti: 1.5,
      note: '<p>Clic 1: quanto si perde. Clic 2: la rottura con i socialrivoluzionari di sinistra. Dei quattro imperi crollati con la guerra, quello russo cede per primo.</p><p><b>Carta</b>: autoprodotta dai dati Natural Earth. Il confine del 1914 e la linea del trattato sono <b>tracciati a mano</b>, approssimativi: servono a vedere l’ordine di grandezza, non a leggere un confine. L’Ucraina è indipendente sotto protezione tedesca; la Polonia e i Paesi baltici restano sotto occupazione tedesca.</p>' },

    { titolo: 'La guerra civile, 1918-1920', html: S_GUERRA, minuti: 3,
      note: '<p>Quattro clic: area rossa, Bianchi, Intesa, Armata rossa. <b>Punta</b> sulla geografia: i Rossi hanno le linee interne e il cuore industriale, i Bianchi sono divisi su un territorio enorme. I contadini diffidano dei bolscevichi, ma temono di più il ritorno dei vecchi proprietari.</p><p>Ekaterinburg è sulla carta: lì, nel luglio 1918, viene uccisa la famiglia imperiale (passo successivo).</p><p><b>Carta</b>: autoprodotta; l’area rossa (ottobre 1919) e le frecce sono tracciate a mano e approssimative. Le frecce dei Bianchi non sono contemporanee: Kolčak avanza nella primavera 1919 ed è respinto in estate; Denikin arriva a Orël a metà ottobre 1919; Judenič è alle porte di Pietrogrado nello stesso ottobre. L’Intesa sbarca a Murmansk e Arcangelo nel 1918, a Odessa nel dicembre 1918, a Vladivostok (con il Giappone) nel 1918. Nel tuo schema la guerra civile è datata 1918-1922: qui seguo la Sintesi (1918-1920; nel 1920-1921 si combatte ancora contro la Polonia e in Asia centrale).</p>' },

    { titolo: 'Il comunismo di guerra', html: S_COMUNISMO, minuti: 2.5,
